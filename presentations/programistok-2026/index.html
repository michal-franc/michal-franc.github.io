# Quo Vadis IT

#### Responsibility · Ownership · Agency
#### where engineering is heading, in the face of ~~AI~~ **SI**

Michal Franc · **mfranc.com**

*yes, we call it Super-Intelligence now, apparently (Reuters, 22 Sep 2026)*
<!-- .element: class="plate-label" -->

Note:
**Przywitanie + rapport + jedno-zdaniowe streszczenie całości.**
- Michał Franc, z Wrocławia (Politechnika Wrocławska), pierwszy raz w Białymstoku; otwieram ścieżkę IT. (mów "z Wrocławia" / "w Białymstoku")
- **Rapport:** dobre wspomnienia z Białegostoku, znajomi stąd; słyszałem dużo dobrego o tutejszym IT i Politechnice Białostockiej. (uwaga: TY jesteś z Politechniki Wrocławskiej - Białostocką tylko chwal jako gospodarza, nie pomyl)
- **STRESZCZENIE (powiedz na wejściu - to teza całej prelekcji):** baza zawodu przesuwa się z pisania kodu ku ODPOWIEDZIALNOŚCI, OWNERSHIPOWI i SPRAWCZOŚCI. To ewolucja, nie rewolucja - technologia (AI) tylko przyspiesza, nie jest przyczyną.
- **ŻART (SI):** na slajdzie "AI" jest skreślone i zamienione na "SI" (Super Intelligence). Nawiązanie do newsa (Reuters, 22.09.2026: Trump - USA ma odtąd nazywać AI "super intelligence"). Rzuć z przymrużeniem oka: "w obliczu AI... przepraszam, teraz mówimy SI". Rozluźnia salę i od razu ustawia ton: mniej hype'u, więcej dystansu.
- **BONUS (dwujęzyczny zbieg - podkreśl, bo jest naprawdę fajny):** skrót "SI" działa IDENTYCZNIE po angielsku i po polsku. Super-Intelligence = Superinteligencja, a po polsku "SI" i tak od zawsze znaczy Sztuczną Inteligencję. Te same dwie litery niosą ten sam żart w obu językach - polska sala łapie go PODWÓJNIE: skreślam "AI", piszę "SI", a to jednocześnie i nasze zwykłe SI (sztuczna inteligencja), i nowa "superinteligencja". Po angielsku by tak nie zaskoczyło, po polsku tak - i to jest w tym cool.
- **Oczekiwania:** mało technologii i narzędzi - bardziej o karierze i zmianach w IT.
- **Stąd tytuł:** Quo Vadis IT - dokąd zmierzamy.

## Software keeps getting more complex

<!-- .slide: data-shift="true" -->

### The evolution that got us here

Note:
**Sufit rośnie: software, który budujemy, jest coraz bardziej złożony.**
- Żeby mówić o przyszłości, najpierw ewolucja, która nas tu doprowadziła - o kierunku zmian, nie o przeszłości.
- **Escalator złożoności (animacja od lewej):** proste programy (skrypty, Excel) -> desktop -> web -> mobile -> systemy rozproszone (globalna skala).
- **Kontrargument:** nie przestaliśmy robić prostych rzeczy - dalej je robimy. Rzecz w tym, że SUFIT się podniósł: złożone staje się normą.
- I ta rosnąca złożoność napędza kolejne zmiany.
(przejście -> Complexity forces technology changes)

## Complexity forces technology changes

### Each layer makes yesterday's hard things cheap for everyone

![](images/complexity-layers.svg)

Note:
**Każda warstwa robi wczorajszą elitarną robotę tanią i dostępną dla wszystkich.**
- Rośnie złożoność -> technologia "zawija" ją w coś prostszego, żebyśmy ogarnęli więcej.
- Assembly / ręczna pamięć -> języki wysokiego poziomu -> frameworki -> chmura -> orkiestracja (K8s). Każda warstwa chowa złożoność tej pod spodem.
- **NOWY KĄT:** warstwa nie tylko chowa złożoność - robi trudne rzeczy TAŃSZYMI i ŁATWIEJSZYMI. Własne data center, ręczne zarządzanie pamięcią, skalowanie na miliony - kiedyś elita, dziś out-of-the-box za grosze.
- **Technologia demokratyzuje złożoność:** coraz więcej ludzi buduje coraz bardziej skomplikowane rzeczy. To samo zrobi AI na kolejnym poziomie.
- **NA SLAJDZIE:** ostatni stopień to przerywane, pomarańczowe "AI - next?" - wskaż go: kolejna warstwa, ta sama logika.
(przejście -> te same przejścia w umiejętnościach)

## Skills demand keeps shifting

### Don't tie your identity to one technology

![](images/skills-demand.svg)

Note:
**Popyt na umiejętności ciągle się przesuwa - nie przywiązuj tożsamości do jednej technologii.**
- Ta sama ewolucja od strony umiejętności, których szuka rynek (dane ilustracyjne, kierunek zmian; z bloga mfranc.com/blog/ai-2026).
- **Ery:** DESKTOP -> WEB -> CLOUD & MOBILE -> AI; w każdej na wierzch wychodzą inne umiejętności.
- **SZARE = stary świat:** Manual QA (kropkowana) i DBA / Sysadmin (przerywana). Specjaliści wchłonięci przez automatyzację i chmurę - zobacz, jak linia DBA spada dokładnie wtedy, gdy rośnie Cloud (~2012-2015).
- **OOP:** rośnie od 1995, szczyt ~2010, potem spada - nie znika, staje się bazą. Powiedz: "kiedy zaczynałem, OOP było TĄ umiejętnością - dziś to po prostu standard".
- **KOLOROWE linie startują w roku, w którym umiejętność się pojawiła:** Test Automation i DevOps/SRE ~2005, Cloud ~2010, AI/ML ~2012, LLM-assisted ~2023 - i od razu eksploduje.
(przejście -> jak zmienia się fokus inżyniera)

## The engineer's focus shifts

### Less *how* - more *what* & *why*

![](images/engineer-focus.svg)

Note:
**Kod się kurczy, rosną system design i domena - "co i po co", nie "jak".**
- **Skład tego, co znaczy być inżynierem, w czasie (ilustracyjnie, z bloga). Pola od dołu:** Algorithms/DS, Coding, Testing, System Design, Domain Expertise.
- Kiedyś dominowały algorytmy i samo pisanie kodu (wielki niebieski pas). Ten pas się kurczy, rosną System Design i Domain Expertise (pomarańczowy).
- **To ta sama teza całej prelekcji jako wykres:** środek ciężkości z "jak napisać kod" ku domenie/wartości. Kod nie znika - przestaje być większością. (seed - wróci na "center of attention")
(przejście -> From skill silos to domain silos)

## Complexity shifts the roles too

<!-- .slide: data-merge="true" data-visibility="hidden" -->

As complexity rises, the roles shift and change too.

Note:
**Rosnąca złożoność scala role - jeden inżynier bierze na siebie coraz więcej (shift-left).**
- Przesuwają się nie tylko technologie, ale i role.
- **Scalanie (animacja):** Frontend + Backend + QA -> Full-stack Engineer; Backend + IT Ops -> DevOps; DevOps + Security -> DevSecOps.
- **Nowa oś to BIZNES:** Full-stack + Business -> PRODUCT ENGINEER (nie DevOps - to biznes dokłada nowy wymiar).
- A Full-stack + DevOps -> ??? - jeszcze nie wiemy, jak to nazwać. Nie każde scalenie ma już nazwę - dowód, że jesteśmy w ŚRODKU transformacji, nie na końcu.
- Kiedyś osobne działy podawały pracę dalej; dziś jeden inżynier bierze to wszystko na siebie.
- **Efekt:** specjalizacja już nie stoi "sama" - siedzi na szerokiej, wspólnej bazie (trochę wszystkiego + głębia na wierzchu, T-shape). Różni nas to, co budujemy na wierzchu.

## From skill silos to domain silos

### **Complexity** regroups teams by domain, not discipline

![](images/skills-to-domain.svg)

Note:
**DLACZEGO to się stało - napędziła to ZŁOŻONOŚĆ software'u (callback do "complexity forces changes"). Gdy systemy zrobiły się złożone, silosy dyscyplin (QA / Dev / DevOps, handoffy "przez ściany", kolejki) przestały nadążać - trzeba było przegrupować zespoły wokół DOMENY, żeby ktoś ogarniał złożoność end-to-end.**
- **Lewo (siloed by skill):** jedna dyscyplina na zespół - osobny team QA, osobny Dev, osobny DevOps. Przy prostych systemach działało; przy złożonych handoffy między silosami stają się wąskim gardłem.
- **Prawo (grouped by domain):** zespół domenowy (Payments, Checkout, Search) trzyma CAŁĄ wartość end-to-end - ma w środku QA, Dev i Ops. To Team Topologies / stream-aligned teams / DDD bounded contexts - odpowiedź właśnie na złożoność.
- **Puenta (spina z tezą):** to nie moda organizacyjna - to złożoność software'u wymusza przegrupowanie wokół WARTOŚCI i DOMENY, nie wokół umiejętności. Ta sama ewolucja co przez całą prelekcję, tylko widziana od strony struktury organizacji.
- **Dół slajdu, "specialists absorbed: DBA · manual QA · sysadmin":** wzorzec się powtarza - specjaliści mówili "tego nie da się zautomatyzować", potem przyszła chmura/automatyzacja. Rola nie znika - kurczy się i wchodzi do zespołu (callback do linii DBA na wykresie). Następne w kolejce: ręczne pisanie i czytanie kodu.
(przejście -> Evolution, not revolution)

## Evolution, not revolution
<!-- .slide: data-accel="true" -->

**complexity + cost + more users** -> we found a way to manage it.

AI is just the **natural next step** in this evolution.

Note:
**AI nie zmienia kierunku - tylko przyspiesza ewolucję, która trwa od lat.**
- To ewolucja, nie rewolucja; ten kierunek trwa od lat.
- **Pętla (od dekad):** złożoność + rośnie liczba użytkowników + koszty -> branża buduje narzędzie, żeby to ogarnąć.
- **KLUCZOWY ANGLE:** AI to NATURALNA KONSEKWENCJA tych samych sił - presji rynku i rosnącej złożoności - które działają 20+ lat. Nie przypadek, nie rewolucja: nieunikniony kolejny krok tej samej ewolucji.
- **Szybki callback TYLKO ustnie (linii nie ma już na slajdzie):** "pamiętacie schody" - asembler -> wysoki poziom -> frameworki -> Kubernetes... i teraz AI. Slajd mówi wprost: "AI is just the natural next step in this evolution".
- (animacja data-accel: tempo przyspiesza - "slow, for decades" -> "big speed-up", AI)
(przejście -> What comes next?)

## What comes next?

<!-- .slide: class="title-only" -->

### Predictions, not promises

Note:
**Kierunek mamy ustalony (ewolucja, nie rewolucja) - teraz patrzymy W PRZÓD: jak ta ewolucja będzie wyglądać dalej.**
- **Hinge (powiedz na wejściu):** pytanie już nie brzmi "czy", tylko "JAK to rozwinie się dalej i czego się spodziewać". Zmiana narracji - z diagnozy rynku na obraz przyszłości.
- **Rozbrajający disclaimer (KLUCZOWE, zaznacz raz):** to o czym powiem nie jest tak, że na 100% się spełni ani "na pewno tak będzie". Ktoś może powiedzieć, że nie mam pojęcia albo "za 10 lat na pewno tak nie będzie" - i słusznie, ciężko przewidzieć przyszłość. To predykcje, które moim zdaniem prawdopodobnie wejdą - kilka tematów jako jedzenie do przemyślenia i do dyskusji w kuluarach / na backstage'u po prelekcji. Prowokacja i wizja, nie twarda prognoza. (Ten jeden uczciwy oddech kupuje prawo do śmiałych tez przez resztę części 2.)
- **NA SLAJDZIE:** "What comes next? / Predictions, not promises" - disclaimer jest teraz na ekranie, więc powiedz go krótko i własnymi słowami, nie czytaj.
- **Handoff:** to otwiera drugą część - Software 1.0 -> 2.0, wymiar po wymiarze, i co to dla nas znaczy.
- (Delivery: nie zaczynaj od "myśląc myślami do przodu" - wejdź czysto: "patrząc do przodu". To slajd ~30 s, cały czas zejdź na hinge + disclaimer, nie na powtarzanie pytania.)
(przejście -> The local-optimum trap)

## The local-optimum trap

### 1.0 + agents: quick boost, then a dead end.
### Aim for **Software 2.0**.

![](images/local-optimum.svg)

Note:
**Software 1.0 + AI to lokalne optimum - celuj w Software 2.0.**
- Software 1.0 + AI (agenty na dzisiejszej pracy) to szybki, kuszący wzrost - ale tylko małe wzgórze. Wygląda produktywnie, jest krótkowzroczne.
- **PERSONALIZACJA (mocne, użyj):** 20 lat doświadczenia = głęboko wbudowane "sieci neuronowe" w mojej głowie - myślę o software'ze w trybie 1.0. Kiedy przykładam AI do TEGO myślenia, owszem, dostaję boost wartości i kodu... ale wpadam w pułapkę lokalnego optimum. Mój mózg jest jak model wytrenowany na starych danych.
- **Prawdziwy szczyt wyżej - Software 2.0:** celujesz w wartość i wyniki, nie w szybsze taski. Trzeba zejść z lokalnego szczytu, przejść dolinę (przemyśleć, jak budujemy) i wejść na właściwy szczyt.
- **MARKER "we are ~here":** stoi PRZED czerwonym szczytem, na zboczu - większość branży dopiero goni szybki boost. Pułapka jest PRZED nami, więc to okno, żeby od razu celować w 2.0, zamiast wspinać się na małe wzgórze.
- Nie wierz, że "obecna praca szybciej to przyszłość" - inaczej utkniesz w tymczasowym booście. To lokalne optimum jest TYMCZASOWE - prawdziwa przyszłość to kolejna granica (Software 2.0).

## Determinism

### To go **faster**, do we accept non-determinism?

![](images/nb-determinism.svg)

Note:
**Determinism. 1.0: system STEROWANY LOGIKĄ - ten sam input zawsze daje ten sam output; robota polega na wymyśleniu, jaki output ma być dla danego inputu. 2.0: inny świat - modelu nie "rozumujemy" logicznie; tworzymy INCENTYW, żeby model dał nam konkretną odpowiedź (steruje nim bodziec, nie logika).**
- **Runs na slajdzie:** 1.0 zawsze 5->42 (100% identyczne). 2.0 najczęściej 5->42 (też się zgadza), ale rzadko 5->43 (źle). Model bywa zgodny, ale nie zawsze - i o to chodzi.
- **LICZBY (kluczowy kadr):** 1.0 = 100.00% deterministyczne. 2.0 = 99.99% - pytanie do sali: czy jesteśmy OK z tym 0.01%, że nie jest w pełni deterministyczne? Odpowiedź: TAK, jeśli te 0.01% obsłuży warstwa wokół - ARCHITEKTURA, SYSTEM DESIGN, UX. To one łapią odchylenie i dają stabilny PRODUKT. Stabilizujemy CAŁY system, nie każdą pojedynczą odpowiedź.
- **PRECEDENS (mocny, opowiedz):** już to przerabialiśmy w systemach rozproszonych. Żeby przyspieszyć i skalować, ŚWIADOMIE zrezygnowaliśmy z gwarancji i zbudowaliśmy rzeczy wokół tego. Najlepszy przykład to NoSQL: oddaliśmy ACID (i inne gwarancje), przeszliśmy na eventual consistency - i nauczyliśmy się to obudowywać. Ta sama wymiana: mniej gwarancji za większą szybkość, potem inżynieria wokół. Teraz robimy to na warstwie modelu.
- **CPU / SCHEDULER (dorzuć w tym samym duchu co NoSQL - "to już robiliśmy"):** nawet 1.0 nie jest w pełni deterministyczne. Wielowątkowość bez synchronizacji - kolejność ustala scheduler: A: x+=1, B: x*=2 daje 2 albo 1. Ten sam kod, ten sam CPU, dwa wyniki (do tego CPU wykonuje instrukcje out-of-order, µops, spekulatywnie). Determinizm ZAWSZE był inżynierowany na wierzchu chaosu, tylko warstwę niżej (memory model, locki). AI nie wprowadza niedeterminizmu do idealnego świata - przesuwa go W GÓRĘ, do logiki aplikacji, gdzie teraz potrzebna ta sama dyscyplina. (Te "100%" dla 1.0 to "100% na kontrakcie logiki, dla programu deterministycznego" - nie na każdej warstwie.)
- **NA SLAJDZIE (dół):** "the 0.01% -> architecture · system design · UX -> stable product" - to jest ODPOWIEDŹ na pytanie z tytułu. Pod spodem jedna szara linijka: "we've done this before: NoSQL dropped ACID · CPUs were never deterministic" - to sygnał, żeby opowiedzieć dwie historie poniżej (ramki zeszły ze slajdu do notatek).
- **RAMKA 1 (dawniej na slajdzie) - "We have done this before.":** Distributed systems & NoSQL gave up guarantees - dropped ACID - to scale and go faster, then engineered around it (eventual consistency). Same trade - now at the model layer.
- **RAMKA 2 (dawniej na slajdzie) - "Determinism was already a lie.":** Threads, schedulers, out-of-order CPUs - same code, same CPU, two results. We always tamed it a layer down (memory model, locks). AI just moves it up into the app.
- **Predykcja:** tak jak nauczyliśmy się budować niezawodne produkty na zawodnej infrastrukturze rozproszonej, tak nauczymy się budować stabilne produkty na niedeterministycznych modelach.
(przejście -> Practices)

## Determinism is actually a lie
<!-- .slide: data-visibility="hidden" -->

### We already live with non-determinism - we just engineered around it

![](images/determinism-lie.svg)

Note:
**"Determinizm" w 1.0 to już uproszczenie. Determinizm mieliśmy realnie tylko na poziomie KONTRAKTU języka, dla grzecznego, jednowątkowego kodu. Pod spodem od zawsze jest chaos, który OBUDOWALIŚMY. Cztery przykłady, które już mamy:**
- **1 · WĄTKI (no linearization):** bez synchronizacji kolejność zależy od schedulera. A: x+=1, B: x*=2 → zależnie od kolejności wychodzi 2 albo 1. Ten sam kod, ten sam CPU, dwa wyniki. (Java Memory Model / happens-before to właśnie obudowa tego chaosu.)
- **2 · JIT (C2):** ten sam bytecode kompiluje się w RUNTIME - a optymalizacje zależą od RUNTIME i WĄTKÓW (feedback od kolegi) - raz jedna wersja natywna, raz inna (plus deoptymalizacja). "Ten sam program" to za każdym razem inny kod maszynowy.
- **3 · CPU (out-of-order):** x86 dekoduje instrukcje na µops i wykonuje je poza kolejnością, spekulatywnie. ISA trzyma wynik dla jednego wątku, ale timing i kolejność (między rdzeniami) nie są twoje. (To był ulubiony panel kolegi - "dowozi tezę".)
- **4 · BUILDS:** ten sam source bywa różną binarką (timestampy, kolejność plików, ścieżki) - dlatego "reproducible builds" to osobny ruch i wysiłek.
- **PUENTA (spina z poprzednim slajdem):** determinizm ZAWSZE był inżynierowany na wierzchu chaosu - tylko radziliśmy sobie z nim WARSTWĘ NIŻEJ (memory model, locki, strictfp, pinowanie toolchaina). AI nie wprowadza niedeterminizmu do idealnego świata - przesuwa go W GÓRĘ, do logiki aplikacji, gdzie teraz potrzebna ta sama dyscyplina.
- **Uczciwe doprecyzowanie do poprzedniego slajdu:** te "100%" dla 1.0 to "100% na kontrakcie logiki, dla programu deterministycznego" - nie na każdej warstwie.
- (Inspiracja + feedback: rozmowa na Discordzie - wątki/JMM, C2 (runtime+wątki), µops, reproducible builds. Dobra amunicja na "mądralę z trzeciego rzędu".)
(przejście -> Practices)

## We own the judgment
<!-- .slide: data-visibility="hidden" -->

## Don't give in to the negativism
<!-- .slide: class="new-world" -->

Every generation is told the industry is ending.

Post-2008's "end" became the next generation's eldorado.

In 2036, they'll call 2026 the **start**.

Note:
**Mów to od siebie, nie czytaj - to slajd do opowiedzenia.**
- **Rozwiń na głos:** post-2008 pisano "agile, proces, managerowie wszędzie - koniec wolności inżyniera". A pokolenie, które weszło w tym narzekaniu, nazwało eldorado dokładnie to, co poprzednicy nazywali końcem.
- **Puenta do powiedzenia:** jesteśmy na początku. Zmień sposób myślenia o pracy - i znajdź wyzwanie warte opanowania.
**Każde pokolenie słyszy, że branża się kończy - a to "kończenie się" bywa cudzym eldorado.**
- **AI-burnout i utrata radości są realne - ale spytaj, skąd:** z intensywności czy ze zmiany charakteru pracy i nowych ról? Za kilka lat temat wygaśnie, bo się przyzwyczaimy.
- **Pytanie jest indywidualne:** znajdź radość w nowych obszarach; niebezpieczeństwo to negatywizm i bańki, w których praca zaczyna obrzydzać.
- **Historia się rymuje:** gdy wchodziłem (depresja po 2008), pisano, że to koniec branży i wolności inżyniera - agile, managerowie, proces wszędzie. A pokolenie, które weszło w tym narzekaniu, zobaczyło jako eldorado dokładnie to, co poprzednicy nazywali końcem.
- W 2036 napiszą, że eldorado się skończyło, a 2026 nazwą jego początkiem - to samo malkontenctwo, zregenerowane. Nie daj się.
- **Ja:** nerd, kochałem assembler i ręczną pamięć, nienawidziłem nudnej pracy po 2008 (frameworki, wysoki poziom) - ale zmieniłem nastawienie i znalazłem nowe specjalizacje do opanowania. Mówię to jako ktoś, kto za miesiąc kończy 40 i "ze stereotypu" powinien narzekać najbardziej.

            const q = new URLSearchParams(location.search);
            const edit = q.get('hidden') === 'show' || q.get('edit') === '1';
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'slides.md?_=' + Date.now(), false); // sync + cache-bust
                xhr.send();
                if (xhr.status && (xhr.status < 200 || xhr.status >= 300)) return edit; // fall back to external load
                let md = xhr.responseText;
                if (edit) {
                    md = md.replace(
                        /^[ \t]*<!--[ \t]*\.slide:[ \t]*data-visibility="hidden"[ \t]*-->[ \t]*$/gm,
                        '<!-- .slide: class="was-hidden" -->');
                }
                const sec = document.querySelector('section[data-markdown]');
                sec.setAttribute('data-markdown', ''); // empty -> use inline template
                const tpl = document.createElement('script');
                tpl.setAttribute('type', 'text/template');
                tpl.textContent = md;
                sec.appendChild(tpl);

            hash: true,
            slideNumber: 'c/t',
            transition: 'slide',
            width: 1280,
            height: 720,

            plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
        });

        /* Speaker notes: bold the label of every "- Label: text" bullet, so each
           note scans as bold summary -> bold point -> detail in presenter view.
           Runs on the rendered notes, so any new note gets it automatically
           (whether or not slides.md already has **...**). Asides that start
           with "(" or "[" are left plain; brackets/quotes must be balanced. */
        Reveal.on('ready', () => {
            const labelEnd = (t) => {
                if (/^\s*[(\[]/.test(t)) return -1;
                let depth = 0, q = false;
                for (let i = 0; i < Math.min(t.length, 95); i++) {
                    const c = t[i];
                    if (c === '(' || c === '[') depth++;
                    else if (c === ')' || c === ']') depth--;
                    else if (c === '"') q = !q;
                    else if (c === ':' && depth === 0 && !q && t[i + 1] === ' ' && i >= 2) return i + 1;
                }
                return -1;
            };
            document.querySelectorAll('.reveal aside.notes li').forEach(li => {
                const first = li.firstChild;
                if (!first || first.nodeType !== Node.TEXT_NODE) return;   // already starts with <strong> etc.
                const t = first.nodeValue, e = labelEnd(t);
                if (e < 0) return;
                const strong = document.createElement('strong');
                strong.textContent = t.slice(0, e);
                first.nodeValue = t.slice(e);
                li.insertBefore(strong, first);
            });
        });

        /* Diagrams fit the space left under the text: markdown wraps each image in
           <p>; lift a lone image out and mark it r-stretch so reveal sizes it to the
           remaining slide height. Bigger text never pushes a diagram off the slide. */
        Reveal.on('ready', () => {
            document.querySelectorAll('.reveal .slides section > p').forEach(p => {
                const img = p.querySelector(':scope > img');
                if (!img || p.children.length !== 1 || p.textContent.trim()) return;
                img.classList.add('r-stretch');
                p.replaceWith(img);
            });
            Reveal.layout();
        });

        if (EDIT_HIDDEN) {
            const st = document.createElement('style');
            st.textContent =
                '.reveal section.was-hidden::after{content:"HIDDEN";position:absolute;top:0;left:0;' +
                "font:700 12px/1 'JetBrains Mono',monospace;letter-spacing:2px;color:#C0504A;" +
                'border:1px solid #C0504A;border-radius:6px;padding:3px 7px;opacity:.85;}' +
                '.hidden-mode-banner{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:60;' +
                "font:700 12px/1 'JetBrains Mono',monospace;letter-spacing:2px;color:#1F2429;" +
                'background:#E3B341;border-radius:6px;padding:5px 10px;}';
            document.head.appendChild(st);
            Reveal.on('ready', () => {
                const banner = document.createElement('div');
                banner.className = 'hidden-mode-banner';
                banner.textContent = 'SHOWING HIDDEN SLIDES';
                document.body.appendChild(banner);
            });
        }

        /* Animation hosts size by width; shrink one if the slide's text leaves it
           too little height, so the d3 diagram never runs off the bottom. */
        function fitAnimHost(host) {
            requestAnimationFrame(() => {
                const section = host.closest('section');
                const H = Reveal.getConfig().height, pad = 12;
                const other = section.scrollHeight - host.offsetHeight;
                const avail = H - other - pad;
                if (host.offsetHeight > avail && avail > 80) {
                    host.style.width = Math.floor(avail * host.offsetWidth / host.offsetHeight) + 'px';
                    host.style.maxWidth = 'none';
                }
                Reveal.layout();
            });
        }

        /* ============================================================
           "Truth in the middle" spectrum (2026 slide)
           Slides opt in with: <!-- .slide: data-spectrum="true" -->
           Two extremes at the ends, a dotted uncertainty band in the
           middle, and a "truth?" marker drifting back and forth.
           ============================================================ */
        (function () {
            const LINE = '#6A6F76', SEP = '#9AA0A6', DIM = '#7A7F86', LIGHT = '#C6CBD1', WHITE = '#FFFFFF';
            const MONO = "'JetBrains Mono', ui-monospace, monospace";
            const x0 = 70, x1 = 1090, Y = 120, xA = 440, xB = 720;
            function mount(section) {
                if (section.__spectrum) return section.__spectrum;
                const host = document.createElement('div');
                host.className = 'spectrum-anim';
                host.style.cssText = 'width:100%;max-width:1100px;margin:1.2em auto 0;';
                section.appendChild(host); fitAnimHost(host);
                const svg = d3.select(host).append('svg').attr('viewBox', '0 0 1160 290')
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');
                svg.append('line').attr('x1', x0).attr('y1', Y).attr('x2', xA).attr('y2', Y).attr('stroke', LINE).attr('stroke-width', 3);
                svg.append('line').attr('x1', xA).attr('y1', Y).attr('x2', xB).attr('y2', Y).attr('stroke', LINE).attr('stroke-width', 3).attr('stroke-dasharray', '2 12').attr('stroke-linecap', 'round');
                svg.append('line').attr('x1', xB).attr('y1', Y).attr('x2', x1).attr('y2', Y).attr('stroke', LINE).attr('stroke-width', 3);
                [xA, xB].forEach(x => svg.append('line').attr('x1', x).attr('y1', Y - 16).attr('x2', x).attr('y2', Y + 16).attr('stroke', SEP).attr('stroke-width', 2));
                [x0, x1].forEach(x => svg.append('line').attr('x1', x).attr('y1', Y - 20).attr('x2', x).attr('y2', Y + 20).attr('stroke', SEP).attr('stroke-width', 3));
                const cap = (x, anchor, l1, l2) => {
                    svg.append('text').attr('x', x).attr('y', Y + 54).attr('text-anchor', anchor).attr('fill', DIM).style('font-family', MONO).style('font-size', '19px').text('extreme');
                    svg.append('text').attr('x', x).attr('y', Y + 88).attr('text-anchor', anchor).attr('fill', LIGHT).style('font-family', MONO).style('font-size', '25px').text(l1);
                    svg.append('text').attr('x', x).attr('y', Y + 118).attr('text-anchor', anchor).attr('fill', LIGHT).style('font-family', MONO).style('font-size', '25px').text(l2);
                    // both extremes end in the same place: doing nothing
                    svg.append('text').attr('x', x).attr('y', Y + 154).attr('text-anchor', anchor).attr('fill', DIM).style('font-family', MONO).style('font-style', 'italic').style('font-size', '19px').text('-> do nothing');
                };
                cap(x0, 'start', 'AI is a bubble -', 'it will collapse');
                cap(x1, 'end', 'AI takes', 'all the jobs');
                svg.append('text').attr('x', (xA + xB) / 2).attr('y', Y + 52).attr('text-anchor', 'middle').attr('fill', DIM).style('font-family', MONO).style('font-size', '18px').text('the truth is somewhere in here');
                const lbl = svg.append('text').attr('y', Y - 34).attr('text-anchor', 'middle').attr('fill', '#E07B39').style('font-family', MONO).style('font-weight', 700).style('font-size', '23px').text('the truth?');
                const ring = svg.append('circle').attr('cy', Y).attr('r', 12).attr('fill', 'none').attr('stroke', '#E07B39').attr('stroke-width', 2);
                const dot = svg.append('circle').attr('cy', Y).attr('r', 6).attr('fill', '#E07B39');
                const stem = svg.append('line').attr('y1', Y - 22).attr('y2', Y - 12).attr('stroke', '#E07B39').attr('stroke-width', 1.5);
                const lo = xA + 42, hi = xB - 42;
                const timer = d3.timer((elapsed) => {
                    const e = 0.5 + 0.5 * Math.sin(elapsed / 1400);
                    const x = lo + (hi - lo) * e;
                    dot.attr('cx', x); ring.attr('cx', x); lbl.attr('x', x); stem.attr('x1', x).attr('x2', x);
                });
                section.__spectrum = { timer, host };
                return section.__spectrum;
            }
            function sync() { const c = Reveal.getCurrentSlide(); if (c && c.hasAttribute('data-spectrum')) mount(c); }
            Reveal.on('ready', sync); Reveal.on('slidechanged', sync);
        })();

        /* ============================================================
           Center-of-gravity animation (title slide)
           Slides opt in with:  <!-- .slide: data-cog="true" -->
           All markup/JS lives here so slides.md stays pure Markdown.
           A "band of value" (spectrum bump) drifts right across an
           abstraction ladder, and the balance point / fulcrum follows -
           the center of gravity of engineering value moving from code
           toward ownership & value.
           ============================================================ */
        (function () {
            // Two synced "center of gravity" panels:
            //  left  - a rosette; the value-band sweeps an abstraction ladder and the
            //          weighted centroid drifts from the machine toward Domain & Value.
            //  right - an IMPLEMENTATION -> HOW & WHY axis; the centroid drifts from
            //          writing the code toward the decisions (how & why).
            const STOPS = ['Machine','Code','Frameworks','Systems','Domain','Value'];
            const spectrum = ['#4A4F55','#565B61','#63686E','#6E737A','#7A7F86','#888E95'];
            const ANG = [210, 150, -90, 90, -30, 30];
            const CX = 185, CY = 185, R = 46, R0 = 46, SIG = 62;
            const capStyle = s => s.style('font-family', "'JetBrains Mono', ui-monospace, monospace");

            function buildRosette(parent) {
                const svg = d3.select(parent).append('svg')
                    .attr('viewBox', '0 0 370 350')
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');
                const pts = ANG.map(a => { const r = a * Math.PI / 180; return { x: CX + R * Math.cos(r), y: CY + R * Math.sin(r), a: r }; });
                const rings = svg.selectAll('circle.ring').data(pts).enter().append('circle').attr('class', 'ring')
                    .attr('cx', d => d.x).attr('cy', d => d.y)
                    .attr('fill', (d, i) => d3.rgb(spectrum[i]).darker(1.6) + '').attr('fill-opacity', 0.85)
                    .attr('stroke', (d, i) => spectrum[i]).attr('stroke-width', 3);
                capStyle(svg.append('text').attr('x', CX).attr('y', 26).attr('text-anchor', 'middle')
                    .attr('fill', '#FFFFFF').style('letter-spacing', '0.14em').style('font-size', '15px').text('center of attention'));
                const link = svg.append('line').attr('x1', CX).attr('y1', 34).attr('stroke', '#8A9098').attr('stroke-width', 1).attr('opacity', 0.5);
                const dot = svg.append('circle').attr('r', 6).attr('fill', '#FFFFFF');
                svg.selectAll('text.stop').data(pts).enter().append('text').attr('class', 'stop')
                    .attr('x', d => CX + (R + R0 + 10) * Math.cos(d.a)).attr('y', d => CY + (R + R0 + 10) * Math.sin(d.a) + 4)
                    .attr('text-anchor', 'middle').attr('fill', '#C7CED6')
                    .style('font-family', "'EB Garamond', serif").style('font-variant', 'small-caps')
                    .style('letter-spacing', '0.06em').style('font-size', '15px').text((d, i) => STOPS[i]);
                return function (tx) {
                    let sw = 0, sx = 0, sy = 0;
                    const w = pts.map(p => { const dx = p.x - tx, dy = p.y - CY; const g = Math.exp(-(dx * dx + dy * dy) / (2 * SIG * SIG)); sw += g; sx += g * p.x; sy += g * p.y; return g; });
                    rings.attr('r', (d, i) => R0 * (0.5 + 0.55 * w[i])).attr('opacity', (d, i) => 0.3 + 0.6 * w[i]);
                    const gx = sw ? sx / sw : CX, gy = sw ? sy / sw : CY;
                    dot.attr('cx', gx).attr('cy', gy); link.attr('x2', gx).attr('y2', gy);
                };
            }

            function buildHowWhy(parent) {
                const svg = d3.select(parent).append('svg')
                    .attr('viewBox', '0 80 520 245')
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');
                svg.append('line').attr('x1', 100).attr('y1', 190).attr('x2', 420).attr('y2', 190).attr('stroke', '#5B6672').attr('stroke-width', 3);
                const how = svg.append('circle').attr('cx', 100).attr('cy', 190).attr('fill', d3.rgb('#565B61').darker(1.4) + '').attr('stroke', '#565B61').attr('stroke-width', 3);
                const why = svg.append('circle').attr('cx', 420).attr('cy', 190).attr('fill', d3.rgb('#E07B39').darker(1.2) + '').attr('stroke', '#E07B39').attr('stroke-width', 3);
                const dot = svg.append('circle').attr('r', 6).attr('fill', '#FFFFFF');
                // the label rides with the dot: an orange "attention" tag above it
                const tag = svg.append('g');
                tag.append('rect').attr('x', -62).attr('y', -18).attr('width', 124).attr('height', 34).attr('rx', 17).attr('fill', '#E07B39');
                capStyle(tag.append('text').attr('text-anchor', 'middle').attr('y', 6).attr('fill', '#1A0F07').style('font-weight', 700).style('font-size', '18px').text('attention'));
                tag.append('path').attr('d', 'M-7,16 L0,26 L7,16 Z').attr('fill', '#E07B39');
                capStyle(svg.append('text').attr('x', 100).attr('y', 266).attr('text-anchor', 'middle').attr('fill', '#C7CED6').style('font-size', '20px').text('implementation'));
                capStyle(svg.append('text').attr('x', 420).attr('y', 266).attr('text-anchor', 'middle').attr('fill', '#E8955A').style('font-weight', 700).style('font-size', '24px').text('how & why'));
                capStyle(svg.append('text').attr('x', 100).attr('y', 292).attr('text-anchor', 'middle').attr('fill', '#8A92A0').style('font-size', '16px').text('code, frameworks,'));
                capStyle(svg.append('text').attr('x', 100).attr('y', 312).attr('text-anchor', 'middle').attr('fill', '#8A92A0').style('font-size', '16px').text('language details'));
                capStyle(svg.append('text').attr('x', 420).attr('y', 292).attr('text-anchor', 'middle').attr('fill', '#8A92A0').style('font-size', '16px').text('decisions & value'));
                return function (e) {
                    how.attr('r', 34 * (1 - 0.4 * e)).attr('opacity', 0.35 + 0.5 * (1 - e));
                    why.attr('r', 22 + 22 * e).attr('opacity', 0.5 + 0.5 * e);
                    const gx = 100 + 320 * e;
                    dot.attr('cx', gx).attr('cy', 190);
                    tag.attr('transform', `translate(${gx},${190 - 74})`);
                };
            }

            function mountCog(section) {
                if (section.__cog) return section.__cog;
                const host = document.createElement('div');
                host.className = 'cog-anim';
                host.style.cssText = 'width:100%;max-width:700px;margin:0.4em auto 0;';
                section.appendChild(host); fitAnimHost(host);
                // one big implementation -> how & why panel (the rosette read as a blur from the room)
                const hFrame = buildHowWhy(host);
                const period = 8000;
                const timer = d3.timer((elapsed) => {
                    const t = (elapsed % (period * 2)) / period;
                    const tri = t < 1 ? t : 2 - t;
                    const e = tri < 0.5 ? 4 * tri ** 3 : 1 - Math.pow(-2 * tri + 2, 3) / 2;
                    hFrame(0.34 + 0.60 * e);
                });
                section.__cog = { timer, host };
                return section.__cog;
            }

            function syncCog() {
                const cur = Reveal.getCurrentSlide();
                if (cur && cur.hasAttribute('data-cog')) mountCog(cur);
            }
            Reveal.on('ready', syncCog);
            Reveal.on('slidechanged', syncCog);
        })();

        /* ============================================================
           Roles-merging animation
           Slides opt in with:  <!-- .slide: data-merge="true" -->
           Specialization collapses as the org evolves with the tech:
           Dev + QA -> Engineer, Dev + IT Ops -> DevOps. Each row
           "breathes" - the two source roles drift together while the
           merged role pulses and glows, then relax (pendulum-like loop).
           ============================================================ */
        (function () {
            const PILL_H = 44, RX = 10, DW = 124;
            const EDGE = '#6A6F76', GLOW = '#FFFFFF', TXT = '#DDE2E8';
            const MONO = "'JetBrains Mono', ui-monospace, monospace";
            const COLX = [100, 410, 720];
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

            // Tracks build up, then converge:
            //  1: Frontend+Backend+QA -> Full-stack Engineer ; Backend+IT Ops -> DevOps
            //  2: Full-stack + Business -> Product Engineer
            //  3: Full-stack + DevOps   -> ???  (not yet named - merging continues)
            //  4: DevOps + Security      -> DevSecOps
            const NODES = [
                { id: 'fe',   label: 'Frontend',            col: 0, y: 48,  stage: 0, color: '#5A5F66' },
                { id: 'be1',  label: 'Backend',             col: 0, y: 108, stage: 0, color: '#5A5F66' },
                { id: 'qa',   label: 'QA',                  col: 0, y: 168, stage: 0, color: '#5A5F66' },
                { id: 'be2',  label: 'Backend',             col: 0, y: 272, stage: 0, color: '#5A5F66' },
                { id: 'ops',  label: 'IT Ops',              col: 0, y: 332, stage: 0, color: '#5A5F66' },
                { id: 'fs',   label: 'Full-stack Engineer', col: 1, y: 108, stage: 1, color: '#8A9098', w: 210 },
                { id: 'dops', label: 'DevOps',              col: 1, y: 300, stage: 1, color: '#8A9098' },
                { id: 'biz',  label: 'Business',            col: 1, y: 40,  stage: 2, color: '#6E7379' },
                { id: 'sec',  label: 'Security',            col: 1, y: 392, stage: 4, color: '#6E7379' },
                { id: 'eng',  label: 'Product Engineer',    col: 2, y: 74,  stage: 2, color: '#E07B39', w: 210 },
                { id: 'unk',  label: '???',                 col: 2, y: 204, stage: 3, color: '#9AA0A6', w: 90 },
                { id: 'dso',  label: 'DevSecOps',           col: 2, y: 352, stage: 4, color: '#E07B39', w: 150 },
            ];
            const EDGES = [
                { from: 'fe',  to: 'fs',   stage: 1 },
                { from: 'be1', to: 'fs',   stage: 1 },
                { from: 'qa',  to: 'fs',   stage: 1 },
                { from: 'be2', to: 'dops', stage: 1 },
                { from: 'ops', to: 'dops', stage: 1 },
                { from: 'biz', to: 'eng',  stage: 2 },
                { from: 'fs',  to: 'eng',  stage: 2 },
                { from: 'fs',  to: 'unk',  stage: 3 },
                { from: 'dops', to: 'unk', stage: 3 },
                { from: 'dops', to: 'dso', stage: 4 },
                { from: 'sec', to: 'dso',  stage: 4 },
            ];
            const N = Object.fromEntries(NODES.map(n => [n.id, n]));
            const W = n => n.w || DW;

            function pill(g, label, color, w) {
                g.append('rect')
                    .attr('x', -w / 2).attr('y', -PILL_H / 2)
                    .attr('width', w).attr('height', PILL_H).attr('rx', RX)
                    .attr('fill', d3.rgb(color).darker(1.4) + '')
                    .attr('stroke', color).attr('stroke-width', 2);
                g.append('text').attr('text-anchor', 'middle').attr('dy', '0.34em')
                    .attr('fill', (color === '#FFFFFF' || color === '#D6DADF') ? '#111' : TXT)
                    .style('font-family', MONO)
                    .style('font-weight', 700).style('font-size', '14px')
                    .text(label);
            }

            function mountMerge(section) {
                if (section.__merge) return section.__merge;
                const host = document.createElement('div');
                host.className = 'merge-anim';
                host.style.cssText = 'width:64%;max-width:640px;margin:0.2em auto 0;';
                section.appendChild(host); fitAnimHost(host);

                const svg = d3.select(host).append('svg')
                    .attr('viewBox', '0 0 920 420')
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');

                const gE = svg.append('g'), gN = svg.append('g');

                const edgeSel = gE.selectAll('line').data(EDGES).enter().append('line')
                    .attr('x1', d => COLX[N[d.from].col] + W(N[d.from]) / 2).attr('y1', d => N[d.from].y)
                    .attr('x2', d => COLX[N[d.to].col] - W(N[d.to]) / 2).attr('y2', d => N[d.to].y)
                    .attr('stroke', EDGE).attr('stroke-width', 2).attr('opacity', 0);

                const mkHalo = (id) => gN.append('rect')
                    .attr('x', COLX[N[id].col] - W(N[id]) / 2 - 6).attr('y', N[id].y - PILL_H / 2 - 6)
                    .attr('width', W(N[id]) + 12).attr('height', PILL_H + 12).attr('rx', RX + 4)
                    .attr('fill', 'none').attr('stroke', '#E07B39').attr('stroke-width', 3).attr('opacity', 0);
                const halo = mkHalo('dso');
                const haloE = mkHalo('eng');

                const nodeSel = gN.selectAll('g.node').data(NODES).enter().append('g').attr('class', 'node')
                    .attr('transform', d => `translate(${COLX[d.col]},${d.y})`);
                nodeSel.each(function (d) { pill(d3.select(this), d.label, d.color, W(d)); });

                function frame(elapsed) {
                    const STAGE_MS = 1400;                          // ~1.4s per stage, holds at the end
                    const phase = clamp(elapsed / STAGE_MS, 0, 5);  // 0..5, no loop
                    nodeSel.attr('opacity', d => d.stage === 0 ? 1 : clamp(phase - d.stage, 0, 1));
                    edgeSel.attr('opacity', d => clamp(phase - d.stage, 0, 1) * 0.55);
                    const base = clamp(phase - 4, 0, 1);
                    halo.attr('opacity', base * (0.45 + 0.35 * Math.sin(elapsed / 480)));
                    const baseE = clamp(phase - 2, 0, 1);
                    haloE.attr('opacity', baseE * (0.45 + 0.35 * Math.sin(elapsed / 520)));
                }

                const timer = d3.timer(frame);
                section.__merge = { timer, host };
                return section.__merge;
            }

            function syncMerge() {
                const cur = Reveal.getCurrentSlide();
                if (cur && cur.hasAttribute('data-merge')) mountMerge(cur);
            }

            Reveal.on('ready', syncMerge);
            Reveal.on('slidechanged', syncMerge);
        })();

        /* ============================================================
           Software: efficiency -> revenue driver animation
           Slides opt in with:  <!-- .slide: data-shift="true" -->
           Five cards build left -> right: simple programs -> desktop ->
           web -> mobile -> distributed systems, each bigger and warmer

        (function () {
            const ACC = '#8A9098', GLOW = '#FFFFFF', MUTED = '#7A7F86';
            const MONO = "'JetBrains Mono', ui-monospace, monospace";
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            // rising-complexity flow, builds left -> right and holds:
            // simple programs -> desktop -> web -> mobile -> distributed systems;
            // each stage bigger and warmer than the last (complexity rises).
            const STAGES = [
                { title: 'Simple programs', sub: 'scripts, Excel', cx: 105, cy: 235, w: 190, h: 110, ts: 18, fill: '#151515', stroke: '#4A4A4A', tc: '#9AA0A6', sc: '#6A6F76', stage: 0 },
                { title: 'Desktop apps', sub: 'one machine', cx: 355, cy: 225, w: 190, h: 130, ts: 20, fill: '#1A1A1A', stroke: '#585858', tc: '#B0B5BB', sc: '#7A7F86', stage: 1 },
                { title: 'Web apps', sub: 'reach everyone', cx: 605, cy: 215, w: 190, h: 150, ts: 20, fill: '#1F1F1F', stroke: '#6E6E6E', tc: '#C6CBD1', sc: '#8A9098', stage: 2 },
                { title: 'Mobile apps', sub: 'in every pocket', cx: 855, cy: 206, w: 190, h: 168, ts: 20, fill: '#262626', stroke: '#9A7A55', tc: '#D6C0A5', sc: '#A08A70', stage: 3 },
                { title: 'Distributed\nsystems', sub: 'global, always-on', cx: 1105, cy: 196, w: 190, h: 188, ts: 20, fill: '#2C2C2C', stroke: '#E07B39', tc: '#E8955A', sc: '#C6CBD1', stage: 4 },
            ];
            const ARROWS = [
                { x1: 205, x2: 255, y: 232, label: '', stage: 1 },
                { x1: 455, x2: 505, y: 222, label: '', stage: 2 },
                { x1: 705, x2: 755, y: 212, label: '', stage: 3 },
                { x1: 955, x2: 1005, y: 202, label: '', stage: 4 },
            ];

            function mount(section) {
                if (section.__shift) return section.__shift;
                const host = document.createElement('div');
                host.className = 'shift-anim';
                host.style.cssText = 'width:94%;max-width:1040px;margin:0.6em auto 0;';
                section.appendChild(host); fitAnimHost(host);

                const svg = d3.select(host).append('svg')
                    .attr('viewBox', '0 85 1200 385')   // top band was empty - cropped
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');

                // growth chart BELOW the cards: users on the systems and the size of
                // the digital economy both climb as software complexity rises.
                // Shares the horizontal axis with the cards; revealed left -> right.
                svg.append('line').attr('x1', 10).attr('y1', 300).attr('x2', 1190).attr('y2', 300)
                    .attr('stroke', '#2A2E33').attr('stroke-width', 1.5).attr('stroke-dasharray', '3 7');
                const bgClip = svg.append('clipPath').attr('id', 'shiftClip')
                    .append('rect').attr('x', 0).attr('y', 300).attr('width', 0).attr('height', 170);
                const bg = svg.append('g').attr('clip-path', 'url(#shiftClip)');
                (function () {
                    const N = 64, X0 = 10, X1 = 1190, BASE = 452;
                    const mk = (maxH, pw) => {
                        const pts = [];
                        for (let i = 0; i <= N; i++) { const t = i / N; pts.push([X0 + t * (X1 - X0), BASE - maxH * Math.pow(t, pw)]); }
                        const line = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
                        const area = 'M' + X0 + ',' + BASE + ' ' + pts.map(q => 'L' + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + ' L' + X1 + ',' + BASE + ' Z';
                        return { line, area };
                    };
                    const eco = mk(132, 2.6), usr = mk(100, 2.0);
                    bg.append('path').attr('d', eco.area).attr('fill', '#E07B39').attr('opacity', 0.12);
                    bg.append('path').attr('d', usr.area).attr('fill', '#57A2B2').attr('opacity', 0.12);
                    bg.append('path').attr('d', eco.line).attr('fill', 'none').attr('stroke', '#E07B39').attr('stroke-width', 2.5).attr('opacity', 0.6);
                    bg.append('path').attr('d', usr.line).attr('fill', 'none').attr('stroke', '#57A2B2').attr('stroke-width', 2.5).attr('opacity', 0.6);
                })();
                (function () {
                    const leg = svg.append('g');
                    const row = (y, col, txt) => {
                        leg.append('rect').attr('x', 24).attr('y', y - 11).attr('width', 18).attr('height', 7).attr('rx', 3.5).attr('fill', col);
                        leg.append('text').attr('x', 52).attr('y', y).attr('fill', '#9AA0A6').style('font-size', '19px').style('font-family', MONO).text(txt);
                    };
                    row(334, '#E07B39', 'digital economy $');
                    row(364, '#57A2B2', 'users on the systems');
                })();

                const arrowSel = ARROWS.map(a => {
                    const g = svg.append('g').attr('opacity', 0);
                    g.append('line').attr('x1', a.x1).attr('y1', a.y).attr('x2', a.x2 - 12).attr('y2', a.y)
                        .attr('stroke', ACC).attr('stroke-width', 4);
                    g.append('path').attr('d', `M${a.x2 - 14},${a.y - 9} L${a.x2},${a.y} L${a.x2 - 14},${a.y + 9} Z`).attr('fill', ACC);
                    g.append('text').attr('x', (a.x1 + a.x2) / 2).attr('y', a.y - 18).attr('text-anchor', 'middle')
                        .attr('fill', MUTED).style('font-size', '14px').style('font-family', MONO).text(a.label);
                    return g;
                });

                const gC = STAGES[4];
                const glow = svg.append('rect').attr('rx', 20).attr('fill', 'none').attr('stroke', GLOW).attr('stroke-width', 3).attr('opacity', 0)
                    .attr('x', gC.cx - gC.w / 2 - 6).attr('y', gC.cy - gC.h / 2 - 6).attr('width', gC.w + 12).attr('height', gC.h + 12);

                const cardSel = STAGES.map(s => {
                    const g = svg.append('g').attr('opacity', 0);
                    g.append('rect').attr('x', s.cx - s.w / 2).attr('y', s.cy - s.h / 2).attr('width', s.w).attr('height', s.h).attr('rx', 16)
                        .attr('fill', s.fill).attr('stroke', s.stroke).attr('stroke-width', 2);
                    // title may be two lines ('\n'); sub-label sits under the last line
                    const lines = s.title.split('\n'), lh = s.ts + 4, y0 = s.cy - 2 - (lines.length - 1) * lh / 2;
                    lines.forEach((ln, k) => g.append('text').attr('x', s.cx).attr('y', y0 + k * lh).attr('text-anchor', 'middle')
                        .attr('fill', s.tc).style('font-weight', 700).style('font-size', s.ts + 'px').style('font-family', MONO).text(ln));
                    g.append('text').attr('x', s.cx).attr('y', y0 + (lines.length - 1) * lh + 28).attr('text-anchor', 'middle')
                        .attr('fill', s.sc).style('font-size', '16px').style('font-family', MONO).text(s.sub);
                    return { g, s };
                });

                function frame(elapsed) {
                    const STAGE_MS = 900;
                    const phase = clamp(elapsed / STAGE_MS, 0, 5);
                    bgClip.attr('width', (phase / 5) * 1200);
                    cardSel.forEach(({ g, s }) => g.attr('opacity', s.stage === 0 ? 1 : clamp(phase - s.stage, 0, 1)));
                    arrowSel.forEach((g, i) => g.attr('opacity', clamp(phase - ARROWS[i].stage, 0, 1)));
                    const base = clamp(phase - 4, 0, 1);
                    glow.attr('opacity', base * (0.3 + 0.3 * Math.sin(elapsed / 500)));
                }

                const timer = d3.timer(frame);
                section.__shift = { timer, host };
                return section.__shift;
            }

            function syncShift() {
                const cur = Reveal.getCurrentSlide();
                if (cur && cur.hasAttribute('data-shift')) mount(cur);
            }
            Reveal.on('ready', syncShift);
            Reveal.on('slidechanged', syncShift);
        })();

        /* ============================================================
           "Pace of change accelerates" animation
           Slides opt in with:  <!-- .slide: data-accel="true" -->
           A pulse sweeps a timeline, accelerating left -> right and
           looping; the tick marks bunch toward "now (AI)". Conveys that
           AI just speeds up a change that was already in motion.
           ============================================================ */
        (function () {
            const ACC = '#FFFFFF', MUTED = '#8A9098', TICK = '#5A6067', GLOW = '#C6CBD1';
            const X0 = 90, X1 = 1010, Y = 190;
            const AIf = 0.45, xAI = X0 + (X1 - X0) * AIf;
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            // ticks: sparse & even before AI (the slow decades), then dense &
            // compressing after AI (the speed-up).
            const ticks = d3.range(6).map(i => X0 + (xAI - X0) * (i / 5))
                .concat(d3.range(1, 12).map(j => xAI + (X1 - xAI) * Math.pow(j / 11, 1.7)));
            // motion: slow linear crawl up to AI, then explosive acceleration.
            function motion(p) {
                if (p < 0.62) return AIf * (p / 0.62);
                const q = (p - 0.62) / 0.38;
                return AIf + (1 - AIf) * q * q;
            }

            function mount(section) {
                if (section.__accel) return section.__accel;
                const host = document.createElement('div');
                host.className = 'accel-anim';
                host.style.cssText = 'width:100%;max-width:1100px;margin:0.8em auto 0;';
                section.appendChild(host); fitAnimHost(host);

                const svg = d3.select(host).append('svg')
                    .attr('viewBox', '0 0 1100 300')
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');

                svg.append('line').attr('x1', X0).attr('y1', Y).attr('x2', X1).attr('y2', Y).attr('stroke', MUTED).attr('stroke-width', 3);
                svg.append('path').attr('d', `M${X1 - 16},${Y - 10} L${X1},${Y} L${X1 - 16},${Y + 10} Z`).attr('fill', MUTED);

                const tickSel = svg.selectAll('rect.tick').data(ticks).enter().append('rect').attr('class', 'tick')
                    .attr('x', d => d - 2).attr('y', Y - 14).attr('width', 4).attr('height', 28).attr('rx', 2).attr('fill', TICK);

                // AI marker in the middle
                const aiGlow = svg.append('circle').attr('cx', xAI).attr('cy', Y).attr('r', 26).attr('fill', 'none').attr('stroke', ACC).attr('stroke-width', 3).attr('opacity', 0);
                svg.append('line').attr('x1', xAI).attr('y1', Y - 34).attr('x2', xAI).attr('y2', Y + 34).attr('stroke', ACC).attr('stroke-width', 4).attr('stroke-linecap', 'round');
                svg.append('text').attr('x', xAI).attr('y', Y - 46).attr('text-anchor', 'middle').attr('fill', ACC).style('font-weight', 700).style('font-size', '34px').style('font-family', "'JetBrains Mono', ui-monospace, monospace").text('AI');

                svg.append('text').attr('x', X0).attr('y', Y + 52).attr('fill', MUTED).style('font-size', '22px').style('font-family', "'JetBrains Mono', ui-monospace, monospace").text('slow, for decades');
                svg.append('text').attr('x', X1).attr('y', Y + 52).attr('text-anchor', 'end').attr('fill', ACC).style('font-weight', 700).style('font-size', '22px').style('font-family', "'JetBrains Mono', ui-monospace, monospace").text('big speed-up');
                svg.append('text').attr('x', (X0 + X1) / 2).attr('y', Y - 108).attr('text-anchor', 'middle').attr('fill', MUTED).style('font-size', '24px').style('font-family', "'JetBrains Mono', ui-monospace, monospace").text('the pace of change accelerates');

                const trail = svg.append('line').attr('stroke', GLOW).attr('stroke-width', 6).attr('stroke-linecap', 'round').attr('opacity', 0.4);
                const glow = svg.append('circle').attr('cy', Y).attr('r', 14).attr('fill', 'none').attr('stroke', GLOW).attr('stroke-width', 3).attr('opacity', 0.6);
                const dot = svg.append('circle').attr('r', 9).attr('cy', Y).attr('fill', ACC);

                function frame(elapsed) {
                    const period = 4200;
                    const p = (elapsed % period) / period;   // 0..1
                    const f = motion(p);
                    const x = X0 + (X1 - X0) * f;
                    const fast = clamp((f - AIf) / (1 - AIf), 0, 1);   // 0 before AI, ramps to 1 after
                    dot.attr('cx', x).attr('r', 8 + 3 * fast);
                    glow.attr('cx', x).attr('r', 12 + 12 * fast);
                    trail.attr('x1', Math.max(X0, x - (20 + 150 * fast))).attr('y1', Y).attr('x2', x).attr('y2', Y).attr('opacity', 0.1 + 0.55 * fast);
                    const near = Math.max(0, 1 - Math.abs(x - xAI) / 60);
                    aiGlow.attr('opacity', near * 0.9).attr('r', 22 + 12 * near);
                    tickSel
                        .attr('fill', d => Math.abs(d - x) < 20 ? GLOW : TICK)
                        .attr('height', d => { const dd = Math.abs(d - x); return dd < 20 ? 40 - dd : 28; })
                        .attr('y', d => { const dd = Math.abs(d - x); const h = dd < 20 ? 40 - dd : 28; return Y - h / 2; });
                }

                const timer = d3.timer(frame);
                section.__accel = { timer, host };
                return section.__accel;
            }

            function syncAccel() {
                const cur = Reveal.getCurrentSlide();
                if (cur && cur.hasAttribute('data-accel')) mount(cur);
            }
            Reveal.on('ready', syncAccel);
            Reveal.on('slidechanged', syncAccel);
        })();

        /* ============================================================
           "Long horizon" (data-horizon): a path advances toward a far
           goal, sagging (entropy) between periodic human course-
           corrections; AI only covers the short "now" segment at front.
           ============================================================ */
        (function () {
            const x0 = 110, x1 = 1055, yNow = 300, yGoal = 120, DRIFT = 46;
            const CORR = [0.25, 0.5, 0.75], B = [0, 0.25, 0.5, 0.75, 1];
            const xt = t => x0 + (x1 - x0) * t;
            const target = t => yNow + (yGoal - yNow) * t;
            const localFrac = t => { for (let k = 0; k < 4; k++) if (t <= B[k + 1] + 1e-9) return (t - B[k]) / (B[k + 1] - B[k]); return 0; };
            const actualY = t => target(t) + DRIFT * localFrac(t);
            const STEPS = d3.range(0, 1.0001, 0.01);
            const pathUpTo = p => 'M' + STEPS.filter(t => t <= p + 1e-9).map(t => `${xt(t).toFixed(1)},${actualY(t).toFixed(1)}`).join(' L');

            function mount(section) {
                if (section.__horizon) return section.__horizon;
                const host = document.createElement('div');
                host.className = 'horizon-anim';
                host.style.cssText = 'width:92%;max-width:1000px;margin:0.6em auto 0;';
                section.appendChild(host); fitAnimHost(host);
                const svg = d3.select(host).append('svg').attr('viewBox', '0 0 1160 380')
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');
                const MONO = "'JetBrains Mono', ui-monospace, monospace";
                // ground + intended line to the horizon
                svg.append('line').attr('x1', x0).attr('y1', yNow).attr('x2', x1).attr('y2', yNow).attr('stroke', '#2A2E33').attr('stroke-width', 2);
                svg.append('line').attr('x1', x0).attr('y1', yNow).attr('x2', x1).attr('y2', yGoal).attr('stroke', '#57A2B2').attr('stroke-opacity', 0.35).attr('stroke-width', 2).attr('stroke-dasharray', '6 8');
                // goal / horizon
                svg.append('circle').attr('cx', x1).attr('cy', yGoal).attr('r', 9).attr('fill', '#57A2B2');
                svg.append('text').attr('x', x1).attr('y', yGoal - 20).attr('text-anchor', 'end').attr('fill', '#8FC6D3').style('font-family', MONO).style('font-weight', 700).style('font-size', '17px').text('the long horizon');
                svg.append('text').attr('x', x1).attr('y', yGoal + 2).attr('text-anchor', 'end').attr('fill', '#8FC6D3').style('font-family', MONO).style('font-size', '13px').text('direction, design - ours');
                svg.append('text').attr('x', x0).attr('y', yNow + 30).attr('text-anchor', 'middle').attr('fill', '#8A9098').style('font-family', MONO).style('font-size', '15px').text('now');
                // faint full road
                svg.append('path').attr('d', pathUpTo(1)).attr('fill', 'none').attr('stroke', '#454A50').attr('stroke-opacity', 0.5).attr('stroke-width', 2).attr('stroke-dasharray', '3 7');
                // correction markers (human nudges the course back up)
                const corr = CORR.map(c => {
                    const g = svg.append('g');
                    g.append('path').attr('d', `M${xt(c)},${target(c) + 8} L${xt(c) - 8},${target(c) + 22} L${xt(c) + 8},${target(c) + 22} Z`).attr('fill', '#E07B39');
                    return g;
                });
                const done = svg.append('path').attr('fill', 'none').attr('stroke', '#57A2B2').attr('stroke-width', 4).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
                const ai = svg.append('line').attr('stroke', '#E07B39').attr('stroke-width', 6).attr('stroke-linecap', 'round');
                const dot = svg.append('circle').attr('r', 6).attr('fill', '#F4F4F4');
                const aiLbl = svg.append('text').attr('fill', '#E07B39').style('font-family', MONO).style('font-weight', 700).style('font-size', '13px').attr('text-anchor', 'middle').text('AI: now');

                const period = 7200, draw = 5600;
                const timer = d3.timer((elapsed) => {
                    const cyc = elapsed % period;
                    const p = Math.max(0, Math.min(1, cyc / draw));
                    done.attr('d', pathUpTo(p));
                    const fx = xt(p), fy = actualY(p);
                    dot.attr('cx', fx).attr('cy', fy);
                    const q = Math.max(0, p - 0.05);
                    ai.attr('x1', xt(q)).attr('y1', actualY(q)).attr('x2', fx).attr('y2', fy);
                    aiLbl.attr('x', fx).attr('y', fy - 16);
                    corr.forEach((g, i) => { const d = (p - CORR[i]) / 0.055; g.attr('opacity', 0.28 + 0.72 * Math.exp(-d * d)); });
                });
                section.__horizon = { timer, host };
                return section.__horizon;
            }
            function sync() { const c = Reveal.getCurrentSlide(); if (c && c.hasAttribute('data-horizon')) mount(c); }
            Reveal.on('ready', sync);
            Reveal.on('slidechanged', sync);
        })();

        /* ============================================================
           Speaker-notes editor (dev only) - enabled with ?edit=1
           Needs the node dev server (make serve-edit / node server.js),
           which serves the deck and persists edits back into slides.md.
           Notes live in slides.md as `Note:` blocks; the server rewrites
           the matching block in place, keeping slides.md pure Markdown.
           The editor keys notes by the DOM order of <aside class="notes">,
           which matches the order of `Note:` blocks in slides.md.
           ============================================================ */
        (function notesEditor() {
            if (!new URLSearchParams(location.search).has('edit')) return;

            if (location.protocol === 'file:') {
                const warn = document.createElement('div');
                warn.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--warn);color:#fff;padding:0.8em 1em;font-family:var(--r-main-font),system-ui,sans-serif;font-size:14px;z-index:9999;text-align:center;';
                warn.innerHTML = 'Notes editor needs the dev server. Run <code>node server.js</code> (or <code>make serve-edit</code>) and open <code>http://localhost:3000/?edit=1</code>';
                document.body.appendChild(warn);
                return;
            }

            let notes = [];   // note source text, index-aligned with the asides
            async function loadNotes() {
                try { const r = await fetch('/notes'); if (r.ok) notes = await r.json(); }
                catch (e) { console.error('[notes-editor] load failed', e); }
            }

            // Which aside (by DOM order) belongs to a slide; -1 if the slide has none.
            function asideIndexForSlide(slide) {
                if (!slide) return -1;
                const aside = slide.querySelector('aside.notes');
                if (!aside) return -1;
                return Array.from(document.querySelectorAll('aside.notes')).indexOf(aside);
            }

            const panel = document.createElement('div');
            panel.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--bg-elev);border-top:2px solid var(--accent-teal);color:var(--fg);font-family:var(--r-main-font),system-ui,sans-serif;padding:0.6em 1em 0.8em;z-index:9999;box-shadow:0 -8px 24px rgba(0,0,0,0.6);';
            panel.innerHTML = `
                <div style="display:flex;align-items:center;gap:0.8em;margin-bottom:0.4em;font-size:0.85em;">
                    <span style="color:var(--accent-teal);font-weight:700;">Notes</span>
                    <span id="notes-slide-label" style="color:var(--fg-muted);font-family:'JetBrains Mono',monospace;font-size:0.85em;"></span>
                    <span id="notes-status" style="color:var(--fg-muted);font-style:italic;font-size:0.85em;margin-left:auto;"></span>
                    <button id="notes-save" style="background:var(--accent);color:var(--bg);border:0;font-weight:700;padding:0.35em 0.9em;border-radius:4px;cursor:pointer;">save (Ctrl/Cmd+S)</button>
                    <button id="notes-hide" title="hide panel (Shift+N to toggle)" style="background:transparent;color:var(--fg-muted);border:1px solid var(--fg-muted);padding:0.35em 0.6em;border-radius:4px;cursor:pointer;">hide</button>
                </div>
                <textarea id="notes-textarea" spellcheck="false" style="width:100%;height:170px;background:var(--bg);color:var(--fg);border:1px solid var(--fg-muted);border-radius:6px;padding:0.7em 0.9em;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.5;resize:vertical;box-sizing:border-box;"></textarea>
            `;
            document.body.appendChild(panel);

            const ta = panel.querySelector('#notes-textarea');
            const label = panel.querySelector('#notes-slide-label');
            const status = panel.querySelector('#notes-status');
            const saveBtn = panel.querySelector('#notes-save');
            const hideBtn = panel.querySelector('#notes-hide');

            let currentIndex = -1, dirty = false, saveTimer = null;
            const setStatus = (t, c) => { status.textContent = t; status.style.color = c || 'var(--fg-muted)'; };

            function loadCurrent() {
                currentIndex = asideIndexForSlide(Reveal.getCurrentSlide());
                ta.value = currentIndex >= 0 ? (notes[currentIndex] || '') : '';
                ta.disabled = currentIndex < 0;
                label.textContent = currentIndex >= 0 ? `note ${currentIndex + 1} / ${notes.length}` : 'no note on this slide';
                dirty = false; setStatus('');
            }

            async function save() {
                if (currentIndex < 0 || !dirty) return;
                const note = ta.value;
                setStatus('saving...');
                try {
                    const r = await fetch('/notes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ index: currentIndex, note })
                    });
                    if (!r.ok) throw new Error(await r.text());
                    notes[currentIndex] = note;
                    dirty = false;
                    setStatus('saved', 'var(--ok)');
                    setTimeout(() => { if (!dirty) setStatus(''); }, 1500);
                } catch (e) { setStatus('error: ' + e.message, 'var(--warn)'); }
            }

            ta.addEventListener('input', () => {
                dirty = true; setStatus('unsaved');
                clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
            });
            saveBtn.addEventListener('click', save);

            const showChip = document.createElement('button');
            showChip.textContent = 'notes';
            showChip.title = 'show notes editor (Shift+N)';
            showChip.style.cssText = 'position:fixed;bottom:12px;right:12px;background:var(--accent-teal);color:var(--bg);border:0;font-family:var(--r-main-font),system-ui,sans-serif;font-weight:700;font-size:14px;padding:0.5em 0.9em;border-radius:999px;cursor:pointer;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,0.5);display:none;';
            document.body.appendChild(showChip);

            let hidden = false;
            const setHidden = (v) => { hidden = v; panel.style.display = v ? 'none' : 'block'; showChip.style.display = v ? 'block' : 'none'; };
            hideBtn.addEventListener('click', () => setHidden(true));
            showChip.addEventListener('click', () => setHidden(false));

            window.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); save(); return; }
                if (e.shiftKey && (e.key === 'N' || e.key === 'n')) {
                    if (document.activeElement === ta) return;
                    e.preventDefault(); e.stopPropagation(); setHidden(!hidden);
                }
            }, true);

            loadNotes().then(() => {
                Reveal.on('slidechanged', () => { if (dirty) save(); loadCurrent(); });
                loadCurrent();
            });
        })();
    </script>
</body>
</html>

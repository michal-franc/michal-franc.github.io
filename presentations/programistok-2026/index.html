## Software keeps getting more complex

<!-- .slide: data-shift="true" -->

### To talk about the future, we need to talk about the evolution that got us here

Note:
**Sufit rośnie: software, który budujemy, jest coraz bardziej złożony.**
- Żeby mówić o przyszłości, najpierw ewolucja, która nas tu doprowadziła - o kierunku zmian, nie o przeszłości.
- Escalator złożoności (animacja od lewej): proste programy (skrypty, Excel) -> desktop -> web -> mobile -> systemy rozproszone (globalna skala).
- Kontrargument: nie przestaliśmy robić prostych rzeczy - dalej je robimy. Rzecz w tym, że SUFIT się podniósł: złożone staje się normą.
- I ta rosnąca złożoność napędza kolejne zmiany.
(przejście -> Complexity forces technology changes)

## Complexity forces technology changes

### Democratization - each layer eases complexity, making hard things cheaper and easier for everyone

![](images/complexity-layers.svg)

Note:
**Każda warstwa robi wczorajszą elitarną robotę tanią i dostępną dla wszystkich.**
- Rośnie złożoność -> technologia "zawija" ją w coś prostszego, żebyśmy ogarnęli więcej.
- Assembly / ręczna pamięć -> języki wysokiego poziomu -> frameworki -> chmura -> orkiestracja (K8s). Każda warstwa chowa złożoność tej pod spodem.
- NOWY KĄT: warstwa nie tylko chowa złożoność - robi trudne rzeczy TAŃSZYMI i ŁATWIEJSZYMI. Własne data center, ręczne zarządzanie pamięcią, skalowanie na miliony - kiedyś elita, dziś out-of-the-box za grosze.
- Technologia demokratyzuje złożoność: coraz więcej ludzi buduje coraz bardziej skomplikowane rzeczy. To samo zrobi AI na kolejnym poziomie.
(przejście -> te same przejścia w umiejętnościach)

---

![](images/skills-demand.svg)

Note:
**Popyt na umiejętności ciągle się przesuwa - nie przywiązuj tożsamości do jednej technologii.**
- Ta sama ewolucja od strony umiejętności, których szuka rynek (dane ilustracyjne, kierunek zmian; z bloga mfranc.com/blog/ai-2026).
- Ery: DESKTOP -> WEB -> CLOUD & MOBILE -> AI; w każdej na wierzch wychodzą inne umiejętności.
- Manual QA spada od lat (rutyna znika). Test Automation, Cloud, DevOps/SRE, Security rosną falami. AI/ML i LLM-assisted startują nisko i eksplodują dopiero teraz.
(przejście -> jak zmienia się fokus inżyniera)

## Complexity shifts the roles too

<!-- .slide: data-merge="true" data-visibility="hidden" -->

As complexity rises, the roles shift and change too.

Note:
**Rosnąca złożoność scala role - jeden inżynier bierze na siebie coraz więcej (shift-left).**
- Przesuwają się nie tylko technologie, ale i role.
- Scalanie (animacja): Frontend + Backend + QA -> Full-stack Engineer; Backend + IT Ops -> DevOps; DevOps + Security -> DevSecOps.
- Nowa oś to BIZNES: Full-stack + Business -> PRODUCT ENGINEER (nie DevOps - to biznes dokłada nowy wymiar).
- A Full-stack + DevOps -> ??? - jeszcze nie wiemy, jak to nazwać. Nie każde scalenie ma już nazwę - dowód, że jesteśmy w ŚRODKU transformacji, nie na końcu.
- Kiedyś osobne działy podawały pracę dalej; dziś jeden inżynier bierze to wszystko na siebie.
- Efekt: specjalizacja już nie stoi "sama" - siedzi na szerokiej, wspólnej bazie (trochę wszystkiego + głębia na wierzchu, T-shape). Różni nas to, co budujemy na wierzchu.

**complexity + cost + more users** -> we found a way to manage it.

assembler -> high-level -> frameworks -> Kubernetes ... and now AI.

<!-- .slide: class="titled" -->

Note:

## The local-optimum trap

Software 1.0 + agents: a quick boost, then a dead end. Aim for **Software 2.0**.

![](images/local-optimum.svg)

Note:
**Software 1.0 + AI to lokalne optimum - celuj w Software 2.0.**
- Software 1.0 + AI (agenty na dzisiejszej pracy) to szybki, kuszący wzrost - ale tylko małe wzgórze. Wygląda produktywnie, jest krótkowzroczne.
- PERSONALIZACJA (mocne, użyj): 20 lat doświadczenia = głęboko wbudowane "sieci neuronowe" w mojej głowie - myślę o software'ze w trybie 1.0. Kiedy przykładam AI do TEGO myślenia, owszem, dostaję boost wartości i kodu... ale wpadam w pułapkę lokalnego optimum. Mój mózg jest jak model wytrenowany na starych danych.
- Prawdziwy szczyt wyżej - Software 2.0: celujesz w wartość i wyniki, nie w szybsze taski. Trzeba zejść z lokalnego szczytu, przejść dolinę (przemyśleć, jak budujemy) i wejść na właściwy szczyt.
- Nie wierz, że "obecna praca szybciej to przyszłość" - inaczej utkniesz w tymczasowym booście. To lokalne optimum jest TYMCZASOWE - prawdziwa przyszłość to kolejna granica (Software 2.0).
(przejście -> Escaping the local optimum)

<!-- .slide: class="new-world" -->

To climb out, we challenge ourselves - and the **thinking of the past**.

## Code

### To go **faster**, we stop hand-writing every line

![](images/nb-code.svg)

Note:
**Code. 1.0: piszemy dużo kodu ręcznie. 2.0: prawie nie piszemy - ręczny kod to nisza (jak dziś natywny dodatek C++ do biblioteki Javy, robi to garstka).**
- Rama sekcji (powiedz raz na wejściu): to wizja/prowokacja, nie twarda prognoza; bierzemy każdy wymiar jako 1.0 -> 2.0.
- TEMPO: to montaż - większość wymiarów SZYBKO, jedno zdanie każdy. Rozwiń tylko Review (hero). Inaczej sekcja puchnie do 8-10 min.
- Anchor: rok temu za "AI napisze za nas kod" uznano by cię za oderwanego od rzeczywistości; dziś większość moich znajomych już to zaakceptowała. Ręczny kod = specjalizacja do krytycznych sytuacji.
(przejście -> Review)

## Review

### To go **faster**, we stop reviewing every line

![](images/nb-review.svg)

Note:
**Review (HERO - tu rozwiń). 1.0: czytamy każdą linię w PR-ze. 2.0: review idzie w górę stacku - ZACHOWANIE systemu, nie diff.**
- Pułapka: skoro agenty piszą kod, a my im nie ufamy, kusi, by przeglądać każdą linię JESZCZE dokładniej. Firmy, które tak robią, odkrywają, że review staje się kolejnym bottleneckiem - zabija velocity.
- 2.0: nie reviewujemy każdej linii ani PR-a; patrzymy na cały system z lotu ptaka i jego ZACHOWANIE.
- Definiujemy MIARY: czy zmiana (na stagingu / produkcji) daje pozytywny efekt userom, czy powoduje regresję lub problem dla biznesu.
- Narzędzia 2.0: A/B testy, eksperymenty, obserwacja zachowań użytkowników - regresje łapiemy po ZACHOWANIU systemu, nie po czytaniu diffa.
(przejście -> Determinism)

## Determinism

### To go **faster**, we accept non-determinism and design around it

![](images/nb-determinism.svg)

Note:
**Determinism. 1.0: system STEROWANY LOGIKĄ - ten sam input zawsze daje ten sam output; robota polega na wymyśleniu, jaki output ma być dla danego inputu. 2.0: inny świat - modelu nie "rozumujemy" logicznie; tworzymy INCENTYW, żeby model dał nam konkretną odpowiedź (steruje nim bodziec, nie logika).**
- Runs na slajdzie: 1.0 zawsze 5->42 (100% identyczne). 2.0 najczęściej 5->42 (też się zgadza), ale rzadko 5->43 (źle). Model bywa zgodny, ale nie zawsze - i o to chodzi.
- LICZBY (kluczowy kadr): 1.0 = 100.00% deterministyczne. 2.0 = 99.99% - pytanie do sali: czy jesteśmy OK z tym 0.01%, że nie jest w pełni deterministyczne? Odpowiedź: TAK, jeśli te 0.01% obsłuży warstwa wokół - ARCHITEKTURA, SYSTEM DESIGN, UX. To one łapią odchylenie i dają stabilny PRODUKT. Stabilizujemy CAŁY system, nie każdą pojedynczą odpowiedź.
- PRECEDENS (mocny, opowiedz): już to przerabialiśmy w systemach rozproszonych. Żeby przyspieszyć i skalować, ŚWIADOMIE zrezygnowaliśmy z gwarancji i zbudowaliśmy rzeczy wokół tego. Najlepszy przykład to NoSQL: oddaliśmy ACID (i inne gwarancje), przeszliśmy na eventual consistency - i nauczyliśmy się to obudowywać. Ta sama wymiana: mniej gwarancji za większą szybkość, potem inżynieria wokół. Teraz robimy to na warstwie modelu.
- Predykcja: tak jak nauczyliśmy się budować niezawodne produkty na zawodnej infrastrukturze rozproszonej, tak nauczymy się budować stabilne produkty na niedeterministycznych modelach.
(przejście -> Determinism is actually a lie)

## Determinism is actually a lie

### Even one CPU never runs your program in order

![](images/determinism-lie.svg)

Note:
**HERO = CPU (feedback od kolegi: "daj samo CPU, dowozi tezę"). Piszesz sekwencję instrukcji (1..5). x86 dekoduje je na µops i wykonuje POZA KOLEJNOŚCIĄ i spekulatywnie - realnie leci np. 5,1,2,(4*),3. Wynik dla jednego wątku i tak się zgadza (retirement w kolejności programu), ale to znaczy, że "determinizm" to KONTRAKT utrzymywany na wierzchu chaosu, nie fakt fizyczny.**
- Puenta (spina z poprzednim slajdem): niedeterminizm nie jest nowy - ZAWSZE był, tylko WARSTWĘ NIŻEJ i obudowany (ISA trzyma wynik dla wątku; my dokładamy memory model, locki). AI nie wprowadza niedeterminizmu do idealnego świata - przesuwa go W GÓRĘ, do logiki aplikacji, gdzie teraz potrzebna ta sama dyscyplina.
- Uczciwe doprecyzowanie do poprzedniego slajdu: te "100%" dla 1.0 to "100% na kontrakcie logiki, dla programu deterministycznego" - nie na każdej warstwie.

## How to prepare - Junior
<!-- .slide: data-visibility="hidden" -->

Note:

- Fundamenty (wskaźniki, pamięć, HTTP, algorytmy) przydadzą się, nawet jeśli stack je ukrywa (JS dev też). Rób leetcode i struktury danych, choćbyś "nie musiał".
- Używaj AI, ale zawsze wiedz, CO i PO CO budujesz. Bierz małe problemy end-to-end - zacznij brać odpowiedzialność za wynik.

<!-- .slide: data-visibility="hidden" -->

### Own it - problems, not tasks

- Own **features and problems** end-to-end, not tickets

## Don't give in to the negativism
<!-- .slide: class="new-world" -->

Every generation is told the industry is **ending**.

Post-2008's "end" became the next generation's **eldorado**.

In 2040, they'll call 2026 the **start**.

Note:
**Mów to od siebie, nie czytaj - to slajd do opowiedzenia.**
- Rozwiń na głos: post-2008 pisano "agile, proces, managerowie wszędzie - koniec wolności inżyniera". A pokolenie, które weszło w tym narzekaniu, nazwało eldorado dokładnie to, co poprzednicy nazywali końcem.
- Puenta do powiedzenia: jesteśmy na początku. Zmień sposób myślenia o pracy - i znajdź wyzwanie warte opanowania.
**Każde pokolenie słyszy, że branża się kończy - a to "kończenie się" bywa cudzym eldorado.**
- AI-burnout i utrata radości są realne - ale spytaj, skąd: z intensywności czy ze zmiany charakteru pracy i nowych ról? Za kilka lat temat wygaśnie, bo się przyzwyczaimy.
- Pytanie jest indywidualne: znajdź radość w nowych obszarach; niebezpieczeństwo to negatywizm i bańki, w których praca zaczyna obrzydzać.

                const gE = svg.append('g'), gN = svg.append('g');

                function frame(elapsed) {

                const timer = d3.timer(frame);

            function syncMerge() {

        /* ============================================================

        (function () {

            const MONO = "'JetBrains Mono', ui-monospace, monospace";
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            // rising-complexity flow, builds left -> right and holds:

            // each stage bigger and warmer than the last (complexity rises).
            const STAGES = [

                { title: 'Desktop apps', sub: 'one machine', cx: 355, cy: 225, w: 190, h: 130, ts: 15, fill: '#1A1A1A', stroke: '#585858', tc: '#B0B5BB', sc: '#7A7F86', stage: 1 },
                { title: 'Web apps', sub: 'reach everyone', cx: 605, cy: 215, w: 190, h: 150, ts: 15, fill: '#1F1F1F', stroke: '#6E6E6E', tc: '#C6CBD1', sc: '#8A9098', stage: 2 },
                { title: 'Mobile apps', sub: 'in every pocket', cx: 855, cy: 206, w: 190, h: 168, ts: 15, fill: '#262626', stroke: '#9A7A55', tc: '#D6C0A5', sc: '#A08A70', stage: 3 },
                { title: 'Distributed systems', sub: 'global, always-on', cx: 1105, cy: 196, w: 190, h: 188, ts: 13, fill: '#2C2C2C', stroke: '#E07B39', tc: '#E8955A', sc: '#C6CBD1', stage: 4 },

            function mount(section) {

                (function () {

                        .attr('stroke', ACC).attr('stroke-width', 4);
                    g.append('path').attr('d', `M${a.x2 - 14},${a.y - 9} L${a.x2},${a.y} L${a.x2 - 14},${a.y + 9} Z`).attr('fill', ACC);
                    g.append('text').attr('x', (a.x1 + a.x2) / 2).attr('y', a.y - 18).attr('text-anchor', 'middle')
                        .attr('fill', MUTED).style('font-size', '14px').style('font-family', MONO).text(a.label);
                    return g;
                });

                const gC = STAGES[4];
                const glow = svg.append('rect').attr('rx', 20).attr('fill', 'none').attr('stroke', GLOW).attr('stroke-width', 3).attr('opacity', 0)
                    .attr('x', gC.cx - gC.w / 2 - 6).attr('y', gC.cy - gC.h / 2 - 6).attr('width', gC.w + 12).attr('height', gC.h + 12);

                const cardSel = STAGES.map(s => {
                    const g = svg.append('g').attr('opacity', 0);
                    g.append('rect').attr('x', s.cx - s.w / 2).attr('y', s.cy - s.h / 2).attr('width', s.w).attr('height', s.h).attr('rx', 16)

            function syncShift() {
                const cur = Reveal.getCurrentSlide();

            Reveal.on('ready', syncShift);
            Reveal.on('slidechanged', syncShift);

        /* ============================================================
           "Pace of change accelerates" animation
           Slides opt in with:  <!-- .slide: data-accel="true" -->
           A pulse sweeps a timeline, accelerating left -> right and
           looping; the tick marks bunch toward "now (AI)". Conveys that
           AI just speeds up a change that was already in motion.
           ============================================================ */
        (function () {
            const ACC = '#FFFFFF', MUTED = '#8A9098', TICK = '#5A6067', GLOW = '#C6CBD1';
            const X0 = 90, X1 = 1010, Y = 190;
            const AIf = 0.45, xAI = X0 + (X1 - X0) * AIf;
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            // ticks: sparse & even before AI (the slow decades), then dense &
            // compressing after AI (the speed-up).
            const ticks = d3.range(6).map(i => X0 + (xAI - X0) * (i / 5))
                .concat(d3.range(1, 12).map(j => xAI + (X1 - xAI) * Math.pow(j / 11, 1.7)));
            // motion: slow linear crawl up to AI, then explosive acceleration.
            function motion(p) {
                if (p < 0.62) return AIf * (p / 0.62);
                const q = (p - 0.62) / 0.38;
                return AIf + (1 - AIf) * q * q;
            }

            function mount(section) {
                if (section.__accel) return section.__accel;
                const host = document.createElement('div');
                host.className = 'accel-anim';
                host.style.cssText = 'width:92%;max-width:960px;margin:0.6em auto 0;';
                section.appendChild(host);

                const svg = d3.select(host).append('svg')
                    .attr('viewBox', '0 0 1100 300')
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');

                svg.append('line').attr('x1', X0).attr('y1', Y).attr('x2', X1).attr('y2', Y).attr('stroke', MUTED).attr('stroke-width', 3);
                svg.append('path').attr('d', `M${X1 - 16},${Y - 10} L${X1},${Y} L${X1 - 16},${Y + 10} Z`).attr('fill', MUTED);

                const tickSel = svg.selectAll('rect.tick').data(ticks).enter().append('rect').attr('class', 'tick')
                    .attr('x', d => d - 2).attr('y', Y - 14).attr('width', 4).attr('height', 28).attr('rx', 2).attr('fill', TICK);

                // AI marker in the middle
                const aiGlow = svg.append('circle').attr('cx', xAI).attr('cy', Y).attr('r', 26).attr('fill', 'none').attr('stroke', ACC).attr('stroke-width', 3).attr('opacity', 0);
                svg.append('line').attr('x1', xAI).attr('y1', Y - 34).attr('x2', xAI).attr('y2', Y + 34).attr('stroke', ACC).attr('stroke-width', 4).attr('stroke-linecap', 'round');
                svg.append('text').attr('x', xAI).attr('y', Y - 46).attr('text-anchor', 'middle').attr('fill', ACC).style('font-weight', 700).style('font-size', '26px').style('font-family', "'JetBrains Mono', ui-monospace, monospace").text('AI');

                svg.append('text').attr('x', X0).attr('y', Y + 46).attr('fill', MUTED).style('font-size', '16px').style('font-family', "'JetBrains Mono', ui-monospace, monospace").text('slow, for decades');
                svg.append('text').attr('x', X1).attr('y', Y + 46).attr('text-anchor', 'end').attr('fill', ACC).style('font-weight', 700).style('font-size', '16px').style('font-family', "'JetBrains Mono', ui-monospace, monospace").text('big speed-up');
                svg.append('text').attr('x', (X0 + X1) / 2).attr('y', Y - 82).attr('text-anchor', 'middle').attr('fill', MUTED).style('font-size', '18px').style('font-family', "'JetBrains Mono', ui-monospace, monospace").text('the pace of change accelerates');

                const trail = svg.append('line').attr('stroke', GLOW).attr('stroke-width', 6).attr('stroke-linecap', 'round').attr('opacity', 0.4);
                const glow = svg.append('circle').attr('cy', Y).attr('r', 14).attr('fill', 'none').attr('stroke', GLOW).attr('stroke-width', 3).attr('opacity', 0.6);
                const dot = svg.append('circle').attr('r', 9).attr('cy', Y).attr('fill', ACC);

                function frame(elapsed) {
                    const period = 4200;
                    const p = (elapsed % period) / period;   // 0..1
                    const f = motion(p);
                    const x = X0 + (X1 - X0) * f;
                    const fast = clamp((f - AIf) / (1 - AIf), 0, 1);   // 0 before AI, ramps to 1 after
                    dot.attr('cx', x).attr('r', 8 + 3 * fast);
                    glow.attr('cx', x).attr('r', 12 + 12 * fast);
                    trail.attr('x1', Math.max(X0, x - (20 + 150 * fast))).attr('y1', Y).attr('x2', x).attr('y2', Y).attr('opacity', 0.1 + 0.55 * fast);
                    const near = Math.max(0, 1 - Math.abs(x - xAI) / 60);
                    aiGlow.attr('opacity', near * 0.9).attr('r', 22 + 12 * near);
                    tickSel
                        .attr('fill', d => Math.abs(d - x) < 20 ? GLOW : TICK)
                        .attr('height', d => { const dd = Math.abs(d - x); return dd < 20 ? 40 - dd : 28; })
                        .attr('y', d => { const dd = Math.abs(d - x); const h = dd < 20 ? 40 - dd : 28; return Y - h / 2; });
                }

                const timer = d3.timer(frame);
                section.__accel = { timer, host };
                return section.__accel;
            }

            function syncAccel() {
                const cur = Reveal.getCurrentSlide();
                if (cur && cur.hasAttribute('data-accel')) mount(cur);
            }
            Reveal.on('ready', syncAccel);
            Reveal.on('slidechanged', syncAccel);
        })();

        /* ============================================================
           "Long horizon" (data-horizon): a path advances toward a far
           goal, sagging (entropy) between periodic human course-
           corrections; AI only covers the short "now" segment at front.
           ============================================================ */
        (function () {
            const x0 = 110, x1 = 1055, yNow = 300, yGoal = 120, DRIFT = 46;
            const CORR = [0.25, 0.5, 0.75], B = [0, 0.25, 0.5, 0.75, 1];
            const xt = t => x0 + (x1 - x0) * t;
            const target = t => yNow + (yGoal - yNow) * t;
            const localFrac = t => { for (let k = 0; k < 4; k++) if (t <= B[k + 1] + 1e-9) return (t - B[k]) / (B[k + 1] - B[k]); return 0; };
            const actualY = t => target(t) + DRIFT * localFrac(t);
            const STEPS = d3.range(0, 1.0001, 0.01);
            const pathUpTo = p => 'M' + STEPS.filter(t => t <= p + 1e-9).map(t => `${xt(t).toFixed(1)},${actualY(t).toFixed(1)}`).join(' L');

            function mount(section) {
                if (section.__horizon) return section.__horizon;
                const host = document.createElement('div');
                host.className = 'horizon-anim';
                host.style.cssText = 'width:92%;max-width:1000px;margin:0.6em auto 0;';
                section.appendChild(host);
                const svg = d3.select(host).append('svg').attr('viewBox', '0 0 1160 380')
                    .style('width', '100%').style('display', 'block').style('overflow', 'visible');
                const MONO = "'JetBrains Mono', ui-monospace, monospace";
                // ground + intended line to the horizon
                svg.append('line').attr('x1', x0).attr('y1', yNow).attr('x2', x1).attr('y2', yNow).attr('stroke', '#2A2E33').attr('stroke-width', 2);
                svg.append('line').attr('x1', x0).attr('y1', yNow).attr('x2', x1).attr('y2', yGoal).attr('stroke', '#57A2B2').attr('stroke-opacity', 0.35).attr('stroke-width', 2).attr('stroke-dasharray', '6 8');
                // goal / horizon
                svg.append('circle').attr('cx', x1).attr('cy', yGoal).attr('r', 9).attr('fill', '#57A2B2');
                svg.append('text').attr('x', x1).attr('y', yGoal - 20).attr('text-anchor', 'end').attr('fill', '#8FC6D3').style('font-family', MONO).style('font-weight', 700).style('font-size', '17px').text('the long horizon');
                svg.append('text').attr('x', x1).attr('y', yGoal + 2).attr('text-anchor', 'end').attr('fill', '#8FC6D3').style('font-family', MONO).style('font-size', '13px').text('direction, design - ours');
                svg.append('text').attr('x', x0).attr('y', yNow + 30).attr('text-anchor', 'middle').attr('fill', '#8A9098').style('font-family', MONO).style('font-size', '15px').text('now');
                // faint full road
                svg.append('path').attr('d', pathUpTo(1)).attr('fill', 'none').attr('stroke', '#454A50').attr('stroke-opacity', 0.5).attr('stroke-width', 2).attr('stroke-dasharray', '3 7');
                // correction markers (human nudges the course back up)
                const corr = CORR.map(c => {
                    const g = svg.append('g');
                    g.append('path').attr('d', `M${xt(c)},${target(c) + 8} L${xt(c) - 8},${target(c) + 22} L${xt(c) + 8},${target(c) + 22} Z`).attr('fill', '#E07B39');
                    return g;
                });
                const done = svg.append('path').attr('fill', 'none').attr('stroke', '#57A2B2').attr('stroke-width', 4).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
                const ai = svg.append('line').attr('stroke', '#E07B39').attr('stroke-width', 6).attr('stroke-linecap', 'round');
                const dot = svg.append('circle').attr('r', 6).attr('fill', '#F4F4F4');
                const aiLbl = svg.append('text').attr('fill', '#E07B39').style('font-family', MONO).style('font-weight', 700).style('font-size', '13px').attr('text-anchor', 'middle').text('AI: now');

                const period = 7200, draw = 5600;
                const timer = d3.timer((elapsed) => {
                    const cyc = elapsed % period;
                    const p = Math.max(0, Math.min(1, cyc / draw));
                    done.attr('d', pathUpTo(p));
                    const fx = xt(p), fy = actualY(p);
                    dot.attr('cx', fx).attr('cy', fy);
                    const q = Math.max(0, p - 0.05);
                    ai.attr('x1', xt(q)).attr('y1', actualY(q)).attr('x2', fx).attr('y2', fy);
                    aiLbl.attr('x', fx).attr('y', fy - 16);
                    corr.forEach((g, i) => { const d = (p - CORR[i]) / 0.055; g.attr('opacity', 0.28 + 0.72 * Math.exp(-d * d)); });
                });
                section.__horizon = { timer, host };
                return section.__horizon;
            }
            function sync() { const c = Reveal.getCurrentSlide(); if (c && c.hasAttribute('data-horizon')) mount(c); }
            Reveal.on('ready', sync);
            Reveal.on('slidechanged', sync);
        })();

        /* ============================================================
           Speaker-notes editor (dev only) - enabled with ?edit=1
           Needs the node dev server (make serve-edit / node server.js),
           which serves the deck and persists edits back into slides.md.
           Notes live in slides.md as `Note:` blocks; the server rewrites
           the matching block in place, keeping slides.md pure Markdown.
           The editor keys notes by the DOM order of <aside class="notes">,
           which matches the order of `Note:` blocks in slides.md.
           ============================================================ */
        (function notesEditor() {
            if (!new URLSearchParams(location.search).has('edit')) return;

            if (location.protocol === 'file:') {
                const warn = document.createElement('div');
                warn.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--warn);color:#fff;padding:0.8em 1em;font-family:var(--r-main-font),system-ui,sans-serif;font-size:14px;z-index:9999;text-align:center;';
                warn.innerHTML = 'Notes editor needs the dev server. Run <code>node server.js</code> (or <code>make serve-edit</code>) and open <code>http://localhost:3000/?edit=1</code>';
                document.body.appendChild(warn);
                return;
            }

            let notes = [];   // note source text, index-aligned with the asides
            async function loadNotes() {
                try { const r = await fetch('/notes'); if (r.ok) notes = await r.json(); }
                catch (e) { console.error('[notes-editor] load failed', e); }
            }

            // Which aside (by DOM order) belongs to a slide; -1 if the slide has none.
            function asideIndexForSlide(slide) {
                if (!slide) return -1;
                const aside = slide.querySelector('aside.notes');
                if (!aside) return -1;
                return Array.from(document.querySelectorAll('aside.notes')).indexOf(aside);
            }

            const panel = document.createElement('div');
            panel.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--bg-elev);border-top:2px solid var(--accent-teal);color:var(--fg);font-family:var(--r-main-font),system-ui,sans-serif;padding:0.6em 1em 0.8em;z-index:9999;box-shadow:0 -8px 24px rgba(0,0,0,0.6);';
            panel.innerHTML = `
                <div style="display:flex;align-items:center;gap:0.8em;margin-bottom:0.4em;font-size:0.85em;">
                    <span style="color:var(--accent-teal);font-weight:700;">Notes</span>
                    <span id="notes-slide-label" style="color:var(--fg-muted);font-family:'JetBrains Mono',monospace;font-size:0.85em;"></span>
                    <span id="notes-status" style="color:var(--fg-muted);font-style:italic;font-size:0.85em;margin-left:auto;"></span>
                    <button id="notes-save" style="background:var(--accent);color:var(--bg);border:0;font-weight:700;padding:0.35em 0.9em;border-radius:4px;cursor:pointer;">save (Ctrl/Cmd+S)</button>
                    <button id="notes-hide" title="hide panel (Shift+N to toggle)" style="background:transparent;color:var(--fg-muted);border:1px solid var(--fg-muted);padding:0.35em 0.6em;border-radius:4px;cursor:pointer;">hide</button>
                </div>
                <textarea id="notes-textarea" spellcheck="false" style="width:100%;height:170px;background:var(--bg);color:var(--fg);border:1px solid var(--fg-muted);border-radius:6px;padding:0.7em 0.9em;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.5;resize:vertical;box-sizing:border-box;"></textarea>
            `;
            document.body.appendChild(panel);

            const ta = panel.querySelector('#notes-textarea');
            const label = panel.querySelector('#notes-slide-label');
            const status = panel.querySelector('#notes-status');
            const saveBtn = panel.querySelector('#notes-save');
            const hideBtn = panel.querySelector('#notes-hide');

            let currentIndex = -1, dirty = false, saveTimer = null;
            const setStatus = (t, c) => { status.textContent = t; status.style.color = c || 'var(--fg-muted)'; };

            function loadCurrent() {
                currentIndex = asideIndexForSlide(Reveal.getCurrentSlide());
                ta.value = currentIndex >= 0 ? (notes[currentIndex] || '') : '';
                ta.disabled = currentIndex < 0;
                label.textContent = currentIndex >= 0 ? `note ${currentIndex + 1} / ${notes.length}` : 'no note on this slide';
                dirty = false; setStatus('');
            }

            async function save() {
                if (currentIndex < 0 || !dirty) return;
                const note = ta.value;
                setStatus('saving...');
                try {
                    const r = await fetch('/notes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ index: currentIndex, note })
                    });
                    if (!r.ok) throw new Error(await r.text());
                    notes[currentIndex] = note;
                    dirty = false;
                    setStatus('saved', 'var(--ok)');
                    setTimeout(() => { if (!dirty) setStatus(''); }, 1500);
                } catch (e) { setStatus('error: ' + e.message, 'var(--warn)'); }
            }

            ta.addEventListener('input', () => {
                dirty = true; setStatus('unsaved');
                clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
            });
            saveBtn.addEventListener('click', save);

            const showChip = document.createElement('button');
            showChip.textContent = 'notes';
            showChip.title = 'show notes editor (Shift+N)';
            showChip.style.cssText = 'position:fixed;bottom:12px;right:12px;background:var(--accent-teal);color:var(--bg);border:0;font-family:var(--r-main-font),system-ui,sans-serif;font-weight:700;font-size:14px;padding:0.5em 0.9em;border-radius:999px;cursor:pointer;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,0.5);display:none;';
            document.body.appendChild(showChip);

            let hidden = false;
            const setHidden = (v) => { hidden = v; panel.style.display = v ? 'none' : 'block'; showChip.style.display = v ? 'block' : 'none'; };
            hideBtn.addEventListener('click', () => setHidden(true));
            showChip.addEventListener('click', () => setHidden(false));

            window.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); save(); return; }
                if (e.shiftKey && (e.key === 'N' || e.key === 'n')) {
                    if (document.activeElement === ta) return;
                    e.preventDefault(); e.stopPropagation(); setHidden(!hidden);
                }
            }, true);

            loadNotes().then(() => {
                Reveal.on('slidechanged', () => { if (dirty) save(); loadCurrent(); });
                loadCurrent();
            });
        })();
    </script>
</body>
</html>

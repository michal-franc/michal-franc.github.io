  <circle cx="350" cy="395" r="40" fill="#3E5A5C" stroke="#5E8A8C" stroke-width="2.5"/>
  <text x="350" y="401" text-anchor="middle" fill="#E4E7EB" font-size="16" font-weight="700">tests</text>

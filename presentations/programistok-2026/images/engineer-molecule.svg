  <line x1="790" y1="330" x2="850" y2="162" stroke="#E07B39" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <text x="808" y="96" fill="#E8955A" font-size="22" font-weight="700">you = the bonds</text>

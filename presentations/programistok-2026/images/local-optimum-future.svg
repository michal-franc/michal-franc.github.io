<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 470" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="lof-ax" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A9098"/></marker>
    <marker id="lof-here" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EDF0F3"/></marker>
  </defs>

  <!-- axes -->
  <line x1="90" y1="410" x2="90" y2="70" stroke="#8A9098" stroke-width="2.5" marker-end="url(#lof-ax)"/>
  <line x1="90" y1="410" x2="1320" y2="410" stroke="#8A9098" stroke-width="2.5" marker-end="url(#lof-ax)"/>
  <text x="56" y="240" text-anchor="middle" fill="#B4BAC0" font-size="17" font-weight="700" transform="rotate(-90 56 240)">value / leverage</text>
  <text x="1320" y="440" text-anchor="end" fill="#B4BAC0" font-size="15" font-weight="700">rethinking the work -&gt;</text>

  <!-- known landscape (solid) - identical to slide 11 -->
  <path d="M 110 372 C 200 372 292 235 360 230 C 432 226 540 292 604 300 C 706 312 852 152 950 132 C 990 126 1020 124 1050 122" fill="none" stroke="#8A9098" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- unknown landscape (dashed) - beyond Software 2.0, we are guessing -->
  <path d="M 1050 122 C 1090 121 1110 168 1140 165 C 1178 161 1210 105 1235 82" fill="none" stroke="#8A9098" stroke-width="3" stroke-linejoin="round" stroke-dasharray="4 10" stroke-opacity="0.75"/>

  <!-- horizon: where the map ends -->
  <line x1="1032" y1="72" x2="1032" y2="400" stroke="#8A9098" stroke-width="1.5" stroke-dasharray="2 8" stroke-opacity="0.35"/>
  <text x="1032" y="60" text-anchor="middle" fill="#8A9098" font-size="11" font-weight="700" opacity="0.8">here the map ends</text>

  <!-- local optimum: Software 1.0 + AI (the trap) -->
  <circle cx="360" cy="230" r="11" fill="#C0504A" stroke="#E7B0AB" stroke-width="2"/>
  <text x="360" y="193" text-anchor="middle" fill="#EDF0F3" font-size="17" font-weight="700">Software 1.0 + AI</text>
  <text x="360" y="213" text-anchor="middle" fill="#D4726B" font-size="13" font-weight="700">a temporary boost - local optimum</text>

  <!-- valley -->
  <text x="604" y="335" text-anchor="middle" fill="#8A9098" font-size="13">rethink how you build</text>

  <!-- global optimum (so far): Software 2.0 -->
  <circle cx="950" cy="132" r="13" fill="#E07B39"/>
  <circle cx="950" cy="132" r="21" fill="none" stroke="#E07B39" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="950" y="95" text-anchor="middle" fill="#E8955A" font-size="18" font-weight="700">Software 2.0</text>
  <text x="950" y="115" text-anchor="middle" fill="#C7CED6" font-size="13">the future - real leverage</text>

  <!-- the next rung: Software 3.0, struck out and renamed Model 1.0? -->
  <circle cx="1235" cy="82" r="20" fill="none" stroke="#57A2B2" stroke-width="1.5" stroke-dasharray="3 5" stroke-opacity="0.5"/>
  <circle cx="1235" cy="82" r="12" fill="none" stroke="#57A2B2" stroke-width="2.5" stroke-dasharray="3 5"/>
  <text x="1235" y="40" text-anchor="middle" fill="#8A9098" font-size="17" font-weight="700">Software 3.0</text>
  <line x1="1176" y1="35" x2="1294" y2="35" stroke="#C0504A" stroke-width="2.5"/>
  <text x="1235" y="66" text-anchor="middle" fill="#57A2B2" font-size="21" font-weight="700">Model 1.0?</text>
  <text x="1235" y="118" text-anchor="middle" fill="#8A9098" font-size="13">not software anymore?</text>

  <!-- you are here: still barely past the local optimum -->
  <circle cx="445" cy="246" r="7" fill="#EDF0F3" stroke="#1F2429" stroke-width="2"/>
  <line x1="486" y1="352" x2="453" y2="258" stroke="#EDF0F3" stroke-width="2.5" marker-end="url(#lof-here)"/>
  <text x="470" y="374" fill="#EDF0F3" font-size="14" font-weight="700">we are ~here</text>
  <text x="470" y="393" fill="#8A9098" font-size="12">industry barely scratching the surface</text>
</svg>

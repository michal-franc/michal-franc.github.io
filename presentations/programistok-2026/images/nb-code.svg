<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="nb-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E07B39"/></marker>
  </defs>

  <!-- ===== Software 1.0 : all hand-crafted ===== -->
  <text x="310" y="44" text-anchor="middle" fill="#EDF0F3" font-size="22" font-weight="700">Software 1.0</text>
  <rect x="90" y="60" width="440" height="215" rx="12" fill="#171C22" stroke="#2E3742" stroke-width="2"/>
  <circle cx="116" cy="86" r="5.5" fill="#E0685C" opacity="0.85"/>
  <circle cx="136" cy="86" r="5.5" fill="#E0A84E" opacity="0.85"/>
  <circle cx="156" cy="86" r="5.5" fill="#6FB86F" opacity="0.85"/>
  <line x1="90" y1="104" x2="530" y2="104" stroke="#2E3742" stroke-width="2"/>
  <!-- code lines - every line human (orange) -->
  <rect x="120" y="118" width="209" height="12" rx="4" fill="#E38A4E"/>
  <rect x="143" y="138" width="274" height="12" rx="4" fill="#E38A4E"/>
  <rect x="143" y="158" width="160" height="12" rx="4" fill="#E38A4E"/>
  <rect x="166" y="178" width="228" height="12" rx="4" fill="#E38A4E"/>
  <rect x="143" y="198" width="258" height="12" rx="4" fill="#E38A4E"/>
  <rect x="120" y="218" width="144" height="12" rx="4" fill="#E38A4E"/>
  <rect x="143" y="238" width="220" height="12" rx="4" fill="#E38A4E"/>
  <text x="310" y="300" text-anchor="middle" fill="#C7CED6" font-size="18">every line hand-written</text>

  <!-- arrow -->
  <line x1="558" y1="167" x2="642" y2="167" stroke="#E07B39" stroke-width="3.5" marker-end="url(#nb-ar)"/>

  <!-- ===== Software 2.0 : AI-driven, human writes the key parts ===== -->
  <text x="890" y="44" text-anchor="middle" fill="#E8955A" font-size="22" font-weight="700">Software 2.0</text>
  <rect x="670" y="60" width="440" height="215" rx="12" fill="#171C22" stroke="#2E3742" stroke-width="2"/>
  <circle cx="696" cy="86" r="5.5" fill="#E0685C" opacity="0.85"/>
  <circle cx="716" cy="86" r="5.5" fill="#E0A84E" opacity="0.85"/>
  <circle cx="736" cy="86" r="5.5" fill="#6FB86F" opacity="0.85"/>
  <line x1="670" y1="104" x2="1110" y2="104" stroke="#2E3742" stroke-width="2"/>
  <!-- code lines - mostly AI (grey), only the key parts human (orange) -->
  <rect x="700" y="118" width="209" height="12" rx="4" fill="#E38A4E"/>
  <rect x="723" y="138" width="274" height="12" rx="4" fill="#5C6772"/>
  <rect x="723" y="158" width="160" height="12" rx="4" fill="#5C6772"/>
  <rect x="746" y="178" width="228" height="12" rx="4" fill="#E38A4E"/>
  <rect x="723" y="198" width="258" height="12" rx="4" fill="#5C6772"/>
  <rect x="700" y="218" width="144" height="12" rx="4" fill="#5C6772"/>
  <rect x="723" y="238" width="220" height="12" rx="4" fill="#5C6772"/>
  <text x="890" y="300" text-anchor="middle" fill="#C7CED6" font-size="18">human writes only the key parts</text>

  <!-- legend -->
  <rect x="398" y="330" width="22" height="14" rx="3" fill="#E38A4E"/>
  <text x="428" y="342" fill="#C7CED6" font-size="16">written by a human</text>
  <rect x="680" y="330" width="22" height="14" rx="3" fill="#5C6772"/>
  <text x="710" y="342" fill="#C7CED6" font-size="16">generated by AI</text>
</svg>

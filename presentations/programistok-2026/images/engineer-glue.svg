<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 10 1080 540" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <!-- the cohesive whole: orange = the engineer as glue + water, filling every gap -->
  <rect x="310" y="50" width="580" height="330" rx="20" fill="#E07B39"/>

  <!-- the LLM's pieces: grey blocks, half-baked on their own, gaps between them -->
  <g fill="#33373C" stroke="#565B61" stroke-width="2">
    <rect x="326" y="66"  width="168" height="94" rx="8"/>
    <rect x="510" y="66"  width="150" height="94" rx="8"/>
    <rect x="676" y="66"  width="182" height="94" rx="8"/>
    <rect x="326" y="176" width="132" height="88" rx="8"/>
    <rect x="474" y="176" width="196" height="88" rx="8"/>
    <rect x="686" y="176" width="172" height="88" rx="8"/>
    <rect x="326" y="280" width="250" height="84" rx="8"/>
    <rect x="592" y="280" width="120" height="84" rx="8"/>
    <rect x="728" y="280" width="130" height="84" rx="8"/>
  </g>

  <!-- labels -->
  <text x="600" y="34" text-anchor="middle" fill="#E8955A" font-size="18" font-weight="700" letter-spacing="2">ONE COHESIVE SYSTEM</text>



  <!-- legend -->
  <rect x="330" y="405" width="22" height="22" rx="4" fill="#33373C" stroke="#565B61" stroke-width="2"/>
  <text x="364" y="423" fill="#B4BAC0" font-size="21">AI's pieces - don't hold together alone</text>
  <rect x="330" y="441" width="22" height="22" rx="4" fill="#E07B39"/>
  <text x="364" y="459" fill="#E8955A" font-size="21">you - the glue + water in the gaps</text>
</svg>

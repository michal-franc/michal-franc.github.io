<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 112 1200 492" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">

  <!-- JUDGMENT: dotted frame wrapping the whole triad -->
  <rect x="344" y="138" width="512" height="420" rx="26" fill="none" stroke="#C6CBD1" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- three overlapping circles (bottom two spread apart) -->
  <g fill="#6E747C" fill-opacity="0.20" stroke="#9AA0A6" stroke-width="2">
    <circle cx="600" cy="272" r="122"/>
    <circle cx="500" cy="422" r="122"/>
    <circle cx="700" cy="422" r="122"/>
  </g>

  <!-- labels, centered in each circle -->
  <text x="600" y="248" text-anchor="middle" fill="#EDF0F3" font-size="20" font-weight="700">RESPONSIBILITY</text>
  <text x="600" y="272" text-anchor="middle" fill="#C6CBD1" font-size="17">on the hook</text>
  <text x="600" y="292" text-anchor="middle" fill="#C6CBD1" font-size="17">for the outcome</text>

  <text x="478" y="446" text-anchor="middle" fill="#EDF0F3" font-size="20" font-weight="700">OWNERSHIP</text>
  <text x="478" y="468" text-anchor="middle" fill="#C6CBD1" font-size="17">carry the problem</text>
  <text x="478" y="488" text-anchor="middle" fill="#C6CBD1" font-size="17">end-to-end</text>

  <text x="724" y="446" text-anchor="middle" fill="#EDF0F3" font-size="20" font-weight="700">AGENCY</text>
  <text x="724" y="468" text-anchor="middle" fill="#C6CBD1" font-size="16">push for change,</text>
  <text x="724" y="487" text-anchor="middle" fill="#C6CBD1" font-size="16">don't wait</text>
  <text x="724" y="506" text-anchor="middle" fill="#C6CBD1" font-size="16">to be told</text>

  <!-- drive value: opaque, at the forefront, on top of everything -->
  <circle cx="600" cy="372" r="56" fill="#E07B39" fill-opacity="0.25"/>
  <circle cx="600" cy="372" r="47" fill="#E07B39" stroke="#F4CBA2" stroke-width="2.5"/>
  <text x="600" y="368" text-anchor="middle" fill="#241206" font-size="18" font-weight="700">drive</text>
  <text x="600" y="388" text-anchor="middle" fill="#241206" font-size="18" font-weight="700">value</text>

  <text x="600" y="592" text-anchor="middle" fill="#9AA0A6" font-size="22">Connected, and <tspan fill="#F4F4F4" font-weight="700">all required</tspan> - together they turn a problem into delivered value.</text>

  <!-- JUDGMENT frame label; black chip breaks the dotted line -->
  <rect x="370" y="126" width="160" height="24" fill="#000000"/>
  <text x="450" y="144" text-anchor="middle" fill="#D7DCE3" font-size="18" font-weight="700" letter-spacing="2">JUDGMENT</text>

  <!-- equation framing: Technology x (the triad / soft skills) -> more value -->
  <rect x="64" y="312" width="216" height="96" rx="14" fill="#6E747C" fill-opacity="0.20" stroke="#9AA0A6" stroke-width="2"/>
  <text x="172" y="368" text-anchor="middle" fill="#EDF0F3" font-size="23" font-weight="700">Technology</text>

  <text x="312" y="375" text-anchor="middle" fill="#C6CBD1" font-size="42" font-weight="700">×</text>

  <text x="888" y="375" text-anchor="middle" fill="#E07B39" font-size="42" font-weight="700">→</text>

  <rect x="920" y="312" width="216" height="96" rx="14" fill="#E07B39" fill-opacity="0.18" stroke="#F4CBA2" stroke-width="2.5"/>
  <text x="1028" y="368" text-anchor="middle" fill="#F4F4F4" font-size="23" font-weight="700">more value</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1200 430" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="ps-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E07B39"/></marker>
  </defs>

  <!-- axis: seniority = scope & impact -->
  <line x1="56" y1="440" x2="56" y2="96" stroke="#E07B39" stroke-width="2.5" marker-end="url(#ps-ar)"/>
  <text transform="translate(40 268) rotate(-90)" text-anchor="middle" fill="#E8955A" font-size="13" font-weight="700" letter-spacing="2">SCOPE &amp; IMPACT</text>

  <!-- the steps: grey (old) -> orange (new) -->
  <rect x="90"  y="380" width="250" height="60"  rx="6" fill="#3A3F45"/>
  <rect x="360" y="310" width="250" height="130" rx="6" fill="#5A4A3E"/>
  <rect x="630" y="240" width="250" height="200" rx="6" fill="#9A5E36"/>
  <rect x="900" y="170" width="250" height="270" rx="6" fill="#E07B39"/>

  <!-- level labels, inside each step -->
  <text x="104" y="418" fill="#C7CED6" font-size="19" font-weight="700" letter-spacing="2">JUNIOR</text>
  <text x="374" y="348" fill="#E3D3C3" font-size="19" font-weight="700" letter-spacing="2">MID</text>
  <text x="644" y="278" fill="#F6E3D2" font-size="19" font-weight="700" letter-spacing="2">SENIOR</text>
  <text x="914" y="208" fill="#241206" font-size="19" font-weight="700" letter-spacing="2">STAFF+</text>
  <!-- what to invest in, above each step -->
  <text x="104" y="314" fill="#D7DCE3" font-size="19" font-weight="700">Go deep</text>
  <text x="104" y="340" fill="#8A9098" font-size="16">fundamentals + AI craft</text>
  <text x="104" y="362" fill="#8A9098" font-size="16">own small problems</text>
  <text x="374" y="244" fill="#E3D3C3" font-size="19" font-weight="700">Problems, not tickets</text>
  <text x="374" y="270" fill="#A89C90" font-size="16">agency: don't wait</text>
  <text x="374" y="292" fill="#A89C90" font-size="16">domain + business sense</text>
  <text x="644" y="174" fill="#EFC9A6" font-size="19" font-weight="700">Judgment &amp; outcomes</text>
  <text x="644" y="200" fill="#C99B6E" font-size="16">define "good enough"</text>
  <text x="644" y="222" fill="#C99B6E" font-size="16">drive value with AI</text>
  <text x="914" y="104" fill="#E8955A" font-size="19" font-weight="700">Set direction</text>
  <text x="914" y="130" fill="#C99B6E" font-size="16">the top of the stairs</text>
  <!-- STAFF+ climax: fill the block with the role facets (dark ink on orange) -->
  <line x1="914" y1="228" x2="1136" y2="228" stroke="#241206" stroke-width="1.5" opacity="0.3"/>
  <text x="914" y="264" fill="#241206" font-size="16" font-weight="700">the intent architect</text>
  <text x="914" y="298" fill="#3A1E0C" font-size="15">sets goals + AI's loops</text>
  <text x="914" y="330" fill="#3A1E0C" font-size="15">managing up, cross-team</text>
  <text x="914" y="362" fill="#3A1E0C" font-size="15">owns direction + outcome</text>

  <text x="620" y="480" text-anchor="middle" fill="#9AA0A6" font-size="19">same tools at every level - what grows is <tspan fill="#F4F4F4" font-weight="700">the problem you own</tspan></text>
</svg>

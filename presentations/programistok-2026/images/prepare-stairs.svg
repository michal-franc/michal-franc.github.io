<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 1200 420" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="ps-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E07B39"/></marker>
  </defs>

  <!-- axis: seniority = scope & impact -->
  <line x1="56" y1="440" x2="56" y2="96" stroke="#E07B39" stroke-width="2.5" marker-end="url(#ps-ar)"/>
  <text transform="translate(40 268) rotate(-90)" text-anchor="middle" fill="#E8955A" font-size="13" font-weight="700" letter-spacing="2">SCOPE &amp; IMPACT</text>

  <!-- the steps: grey (old) -> orange (new) -->
  <rect x="90"  y="380" width="250" height="60"  rx="6" fill="#3A3F45"/>
  <rect x="360" y="310" width="250" height="130" rx="6" fill="#5A4A3E"/>
  <rect x="630" y="240" width="250" height="200" rx="6" fill="#9A5E36"/>
  <rect x="900" y="170" width="250" height="270" rx="6" fill="#E07B39"/>

  <!-- level labels, inside each step -->
  <g font-size="16" font-weight="700" letter-spacing="2">
    <text x="104" y="416" fill="#C7CED6">JUNIOR</text>
    <text x="374" y="346" fill="#E3D3C3">MID</text>
    <text x="644" y="276" fill="#F6E3D2">SENIOR</text>
    <text x="914" y="206" fill="#241206">STAFF+</text>
  </g>

  <!-- what to invest in, above each step -->
  <g font-size="17" font-weight="700">
    <text x="104" y="320" fill="#D7DCE3">Go deep</text>
    <text x="374" y="250" fill="#E3D3C3">Problems, not tickets</text>
    <text x="644" y="180" fill="#EFC9A6">Judgment &amp; outcomes</text>
    <text x="914" y="110" fill="#E8955A">Set direction</text>
  </g>
  <g font-size="13">
    <text x="104" y="342" fill="#8A9098">fundamentals + AI as a craft</text>
    <text x="104" y="360" fill="#8A9098">own small problems end-to-end</text>
    <text x="374" y="272" fill="#A89C90">agency: push, don't wait</text>
    <text x="374" y="290" fill="#A89C90">domain + business sense</text>
    <text x="644" y="202" fill="#C99B6E">define "good enough"</text>
    <text x="644" y="220" fill="#C99B6E">drive value with AI (2.0)</text>
    <text x="914" y="132" fill="#C99B6E">intent architect, org-wide</text>
    <text x="914" y="150" fill="#C99B6E">managing up, relationships</text>
  </g>

  <text x="620" y="478" text-anchor="middle" fill="#9AA0A6" font-size="15">same tools at every level - what grows is <tspan fill="#F4F4F4" font-weight="700">the problem you own</tspan></text>
</svg>

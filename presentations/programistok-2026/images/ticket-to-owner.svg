<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="tto-ar-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E747C"/></marker>
    <marker id="tto-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E07B39"/></marker>
  </defs>

  <!-- ===== LEFT: the ticket machine (old world, grey) ===== -->
  <text x="280" y="34" text-anchor="middle" fill="#8A9098" font-size="16" font-weight="700" letter-spacing="2">THE TICKET MACHINE</text>

  <!-- someone else decides (in) -->
  <rect x="40" y="70" width="230" height="50" rx="8" fill="none" stroke="#565B61" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="155" y="92" text-anchor="middle" fill="#8A9098" font-size="17" font-weight="700">SOMEONE ELSE DECIDES</text>
  <text x="155" y="110" text-anchor="middle" fill="#6E747C" font-size="16">what · why · priority</text>
  <line x1="75" y1="120" x2="75" y2="198" stroke="#6E747C" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#tto-ar-grey)"/>

  <!-- someone else owns (out) -->
  <rect x="300" y="70" width="230" height="50" rx="8" fill="none" stroke="#565B61" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="415" y="92" text-anchor="middle" fill="#8A9098" font-size="17" font-weight="700">SOMEONE ELSE OWNS</text>
  <text x="415" y="110" text-anchor="middle" fill="#6E747C" font-size="16">the outcome · the value</text>
  <line x1="485" y1="200" x2="485" y2="124" stroke="#6E747C" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#tto-ar-grey)"/>

  <!-- conveyor belt -->
  <rect x="40" y="242" width="480" height="14" rx="7" fill="#3A3F45"/>
  <g fill="#2B313B" stroke="#565B61" stroke-width="2">
    <circle cx="62" cy="270" r="8"/><circle cx="117" cy="270" r="8"/><circle cx="172" cy="270" r="8"/><circle cx="227" cy="270" r="8"/>
    <circle cx="282" cy="270" r="8"/><circle cx="337" cy="270" r="8"/><circle cx="392" cy="270" r="8"/><circle cx="447" cy="270" r="8"/><circle cx="502" cy="270" r="8"/>
  </g>

  <!-- tickets in -->
  <g fill="#4A4F55" stroke="#6E747C" stroke-width="1.5">
    <rect x="50" y="204" width="50" height="34" rx="4"/><rect x="110" y="204" width="50" height="34" rx="4"/><rect x="170" y="204" width="50" height="34" rx="4"/>
  </g>
  <g fill="#B4BAC0" font-size="16" text-anchor="middle">
    <text x="75" y="226">#123</text><text x="135" y="226">#124</text><text x="195" y="226">#125</text>
  </g>

  <!-- the station: you -->
  <rect x="233" y="150" width="94" height="90" rx="8" fill="#2B313B" stroke="#7E8894" stroke-width="2"/>
  <text x="280" y="190" text-anchor="middle" fill="#C7CED6" font-size="18" font-weight="700">YOU</text>
  <text x="280" y="212" text-anchor="middle" fill="#8A9098" font-size="16">execute</text>

  <!-- code out -->
  <g fill="#33373C" stroke="#565B61" stroke-width="1.5">
    <rect x="340" y="204" width="50" height="34" rx="4"/><rect x="400" y="204" width="50" height="34" rx="4"/><rect x="460" y="204" width="50" height="34" rx="4"/>
  </g>
  <g fill="#8A9098" font-size="17" text-anchor="middle">
    <text x="365" y="226">&lt;/&gt;</text><text x="425" y="226">&lt;/&gt;</text><text x="485" y="226">&lt;/&gt;</text>
  </g>

  <text x="280" y="450" text-anchor="middle" fill="#B4BAC0" font-size="17" font-weight="700">tickets in -&gt; code out</text>
  <text x="280" y="478" text-anchor="middle" fill="#8A9098" font-size="17">a station on someone else's assembly line</text>

  <!-- ===== the shift ===== -->
  <text x="612" y="214" text-anchor="middle" fill="#8A9098" font-size="16">shift</text>
  <line x1="572" y1="230" x2="652" y2="230" stroke="#E07B39" stroke-width="3" marker-end="url(#tto-ar)"/>

  <!-- ===== RIGHT: the owner (new world, orange) ===== -->
  <text x="910" y="34" text-anchor="middle" fill="#E8955A" font-size="16" font-weight="700" letter-spacing="2">THE OWNER</text>

  <!-- the loop you drive -->
  <g fill="none" stroke="#E07B39" stroke-width="2.5" marker-end="url(#tto-ar)">
    <path d="M954.5 107.8 A130 130 0 0 1 1032.2 185.5"/>
    <path d="M1032.2 274.5 A130 130 0 0 1 954.5 352.2"/>
    <path d="M865.5 352.2 A130 130 0 0 1 787.8 274.5"/>
    <path d="M787.8 185.5 A130 130 0 0 1 865.5 107.8"/>
  </g>

  <!-- stage pills -->
  <g fill="#2B313B" stroke="#E07B39" stroke-width="2">
    <rect x="850" y="82" width="120" height="36" rx="18"/>
    <rect x="980" y="212" width="120" height="36" rx="18"/>
    <rect x="850" y="342" width="120" height="36" rx="18"/>
    <rect x="720" y="212" width="120" height="36" rx="18"/>
  </g>
  <g fill="#F4F4F4" font-size="15" font-weight="700" text-anchor="middle">
    <text x="910" y="105">PROBLEM</text>
    <text x="1040" y="235">DECIDE</text>
    <text x="910" y="365">BUILD</text>
    <text x="780" y="235">OUTCOME</text>
  </g>
  <g fill="#C99B6E" font-size="16" text-anchor="middle">
    <text x="982" y="270" text-anchor="start">system &amp; product calls</text>
    <text x="910" y="398">AI does the typing</text>
    <text x="838" y="270" text-anchor="end">value, measured</text>
  </g>

  <!-- you, at the center of the system -->
  <circle cx="910" cy="230" r="58" fill="#E07B39" fill-opacity="0.22"/>
  <circle cx="910" cy="230" r="48" fill="#E07B39" stroke="#F4CBA2" stroke-width="2.5"/>
  <text x="910" y="228" text-anchor="middle" fill="#241206" font-size="20" font-weight="700">YOU</text>
  <text x="910" y="248" text-anchor="middle" fill="#241206" font-size="16" font-weight="700">own it</text>

  <text x="910" y="450" text-anchor="middle" fill="#E8955A" font-size="17" font-weight="700">problem in -&gt; value out</text>
  <text x="910" y="478" text-anchor="middle" fill="#C99B6E" font-size="17">at the center of the product decisions</text>
</svg>

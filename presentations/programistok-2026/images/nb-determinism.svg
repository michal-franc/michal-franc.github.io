<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 432" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="nb-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E07B39"/></marker>
    <marker id="nb-arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A9098"/></marker>
  </defs>

  <!-- ============ TOP: the two worlds ============ -->
  <text x="310" y="38" text-anchor="middle" fill="#EDF0F3" font-size="22" font-weight="700">Software 1.0</text>
  <text x="890" y="38" text-anchor="middle" fill="#E8955A" font-size="22" font-weight="700">Software 2.0</text>

  <!-- left panel : logic, 100% identical -->
  <rect x="90" y="54" width="440" height="236" rx="12" fill="#171C22" stroke="#2E3742" stroke-width="2"/>
  <circle cx="116" cy="80" r="5.5" fill="#E0685C" opacity="0.85"/><circle cx="136" cy="80" r="5.5" fill="#E0A84E" opacity="0.85"/><circle cx="156" cy="80" r="5.5" fill="#6FB86F" opacity="0.85"/>
  <rect x="438" y="64" width="80" height="26" rx="13" fill="#18271F" stroke="#6FB86F"/>
  <text x="478" y="82" text-anchor="middle" fill="#6FB86F" font-size="15" font-weight="700">100%</text>
  <line x1="90" y1="98" x2="530" y2="98" stroke="#2E3742" stroke-width="2"/>
  <!-- flow x -> LOGIC -> y -->
  <rect x="112" y="110" width="38" height="28" rx="7" fill="#1E242A" stroke="#8A9098" stroke-width="2"/><text x="131" y="130" text-anchor="middle" fill="#EDF0F3" font-size="17">x</text>
  <line x1="152" y1="124" x2="192" y2="124" stroke="#8A9098" stroke-width="2" marker-end="url(#nb-arg)"/>
  <rect x="196" y="108" width="110" height="32" rx="7" fill="#1E242A" stroke="#8A9098" stroke-width="2"/><text x="251" y="129" text-anchor="middle" fill="#C7CED6" font-size="15" font-weight="700">LOGIC</text>
  <line x1="308" y1="124" x2="348" y2="124" stroke="#8A9098" stroke-width="2" marker-end="url(#nb-arg)"/>
  <rect x="352" y="110" width="38" height="28" rx="7" fill="#1E242A" stroke="#6FB86F" stroke-width="2"/><text x="371" y="130" text-anchor="middle" fill="#EDF0F3" font-size="17">y</text>
  <!-- runs: identical -->
  <text x="112" y="158" fill="#8A9098" font-size="15">runs</text>
  <g font-size="20" fill="#C7CED6">
    <text x="155" y="182">5 -&gt; 42</text><text x="155" y="212">5 -&gt; 42</text><text x="155" y="242">5 -&gt; 42</text><text x="155" y="272">5 -&gt; 42</text>
  </g>
  <g stroke="#6FB86F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M305 177 l5 6 l11 -14"/><path d="M305 207 l5 6 l11 -14"/><path d="M305 237 l5 6 l11 -14"/><path d="M305 267 l5 6 l11 -14"/>
  </g>
  <text x="410" y="228" fill="#8A9098" font-size="15">always</text><text x="410" y="245" fill="#8A9098" font-size="15">identical</text>

  <!-- right panel : model, 99.99% -->
  <rect x="670" y="54" width="440" height="236" rx="12" fill="#171C22" stroke="#2E3742" stroke-width="2"/>
  <circle cx="696" cy="80" r="5.5" fill="#E0685C" opacity="0.85"/><circle cx="716" cy="80" r="5.5" fill="#E0A84E" opacity="0.85"/><circle cx="736" cy="80" r="5.5" fill="#6FB86F" opacity="0.85"/>
  <rect x="1012" y="64" width="90" height="26" rx="13" fill="#2A2620" stroke="#E07B39"/>
  <text x="1057" y="82" text-anchor="middle" fill="#E8955A" font-size="15" font-weight="700">99.99%</text>
  <line x1="670" y1="98" x2="1110" y2="98" stroke="#2E3742" stroke-width="2"/>
  <!-- flow x -> MODEL -> ? -->
  <rect x="692" y="110" width="38" height="28" rx="7" fill="#241F1A" stroke="#E07B39" stroke-width="2"/><text x="711" y="130" text-anchor="middle" fill="#EDF0F3" font-size="17">x</text>
  <line x1="732" y1="124" x2="772" y2="124" stroke="#E07B39" stroke-width="2" marker-end="url(#nb-ar)"/>
  <rect x="776" y="108" width="116" height="32" rx="7" fill="#241F1A" stroke="#E07B39" stroke-width="2"/><text x="834" y="129" text-anchor="middle" fill="#E8955A" font-size="15" font-weight="700">MODEL</text>
  <line x1="894" y1="124" x2="934" y2="124" stroke="#E07B39" stroke-width="2" marker-end="url(#nb-ar)"/>
  <rect x="938" y="110" width="38" height="28" rx="7" fill="none" stroke="#E07B39" stroke-width="2" stroke-dasharray="3 4"/><text x="957" y="130" text-anchor="middle" fill="#E8955A" font-size="17">?</text>
  <!-- runs: mostly 42, sometimes 41 (ok), rarely 43 (bad) -->
  <text x="692" y="158" fill="#8A9098" font-size="15">runs</text>
  <g font-size="20" fill="#C7CED6">
    <text x="735" y="182">5 -&gt; 42</text><text x="735" y="212">5 -&gt; 42</text><text x="735" y="242">5 -&gt; 42</text><text x="735" y="272">5 -&gt; 43</text>
  </g>
  <g stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M885 177 l5 6 l11 -14" stroke="#6FB86F"/>
    <path d="M885 207 l5 6 l11 -14" stroke="#6FB86F"/>
    <path d="M885 237 l5 6 l11 -14" stroke="#6FB86F"/>
    <path d="M885 261 l14 14 M899 261 l-14 14" stroke="#E0685C"/>
  </g>
  <text x="935" y="277" fill="#E0685C" font-size="15">bad</text>

  <!-- arrow between -->
  <line x1="558" y1="172" x2="642" y2="172" stroke="#E07B39" stroke-width="3.5" marker-end="url(#nb-ar)"/>

  <!-- ============ BOTTOM: the answer - design around the 0.01% ============ -->
  <line x1="120" y1="318" x2="1080" y2="318" stroke="#2E3742" stroke-width="1.5"/>
  <text x="250" y="366" text-anchor="middle" fill="#E0685C" font-size="20" font-weight="700">the 0.01%</text>
  <line x1="315" y1="360" x2="368" y2="360" stroke="#E07B39" stroke-width="2.5" marker-end="url(#nb-ar)"/>
  <rect x="376" y="338" width="420" height="44" rx="10" fill="#241F1A" stroke="#E07B39" stroke-width="2"/>
  <text x="586" y="366" text-anchor="middle" fill="#E8955A" font-size="19" font-weight="700">architecture · system design · UX</text>
  <line x1="802" y1="360" x2="855" y2="360" stroke="#E07B39" stroke-width="2.5" marker-end="url(#nb-ar)"/>
  <circle cx="882" cy="360" r="16" fill="#6FB86F"/><path d="M873 360 l6 7 l12 -15" stroke="#171C22" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="908" y="366" fill="#C7CED6" font-size="19">stable product</text>

  <!-- minimal trace of the precedents (full story in the speaker notes) -->
  <text x="600" y="420" text-anchor="middle" fill="#8A9098" font-size="17" font-style="italic">we've done this before: NoSQL dropped ACID · CPUs were never deterministic</text>
</svg>
